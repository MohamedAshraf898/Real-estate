verljive, a Društvo i/ili naši pouzdani partneri ih čuvaju na adekvatan način. Molimo Vas da pažljivo pročitate ova pravila privatnosti. Ako se ne slažete s našim postupanjem, molimo Vas da nam ne ustupate svoje lične podatke. Ukoliko nastavite da pregledate našu internet stranicu, potvrđujete da ste saglasni sa ovde navedenim Pravilima.\n\n## Podaci o rukovaocu i primaocu\n\nOdgovornost za obradu podataka o ličnosti u svojstvu rukovaoca snosi:  HSK DEVELOPMENT DOO.\n\nPrimalac podataka o ličnosti može biti privredno društvo HSK DEVELOPMENT DOO.\n\nU slučaju bilo kakvih pitanja ili zahteva u vezi postupanja ili zaštite Vaših ličnih podataka, možete nam se obratiti na e-mail adresu [info@belgradearbor.rs](mailto:info@belgradearbor.rs) ili pisanim putem na gore navedenu adresu našeg sedišta.\n\n## Predmet pravila privatnosti\n\nOva Pravila obuhvataju načine obrade Vaših ličnih podataka kada stupate u interakciju s Društvom, odnosno kada iskažete zainteresovanost za kupovinu nepokretnosti ili stupate u kontakt sa nama u vezi sa zaključenjem ugovora o kupoprodaji nepokretnosti u okviru stambeno-poslovnog kompleksa, odnosno kada:\n\n– posećujete našu internet stranicu, odnosno stranice koje služe za oglašavanje projekata Društva;\n\n– posećujete naše profile na stranicama društvenih mreža;\n\n– komunicirate sa nama telefonom ili preko kontakt forme na internet stranici ili putem email-a ili na neki drugi način;\n\n– koristite naše sisteme i aplikacije;\n\n– posećujete naše prodajne objekte;\n\n– prisustvujete na našim prezentacijama ili poslovnim događajima;\n\n– učestvujete u našim promotivnim odnosno marketing aktivnostima (npr. prijava za newsletter), anketama i slično;\n\n– sa nama zaključite ugovor u vezi sa kupoprodajom nepokretnosti ili drugi ugovor.\n\nObavezno je dostavljanje samo onih ličnih podataka koje prikupljamo za ispunjenje određenih zakonskih obaveza. Dostavljanje ličnih podataka po svim ostalim pravnim osnovima je dobrovoljno, ali napominjemo da ukoliko nam uskratite neke podatke, u određenim situacijama možda nećemo biti u mogućnosti da Vam pružimo neke usluge.\n\n## Lični podaci koje prikupljamo\n\n### 1. Podaci o ličnosti posetilaca naše internet stranice\n\nPrilikom posete naše internet stranice, odnosno internet stranica koje služe oglašavanju projekata Društva, pretraživač koji koristite na vašem uređaju će automatski i bez vaše aktivnosti poslati na server naše internet stranice: IP adresu uređaja sa kog je poslat upit i koji ima pristup internetu, datum i vreme pristupa, ime i URL preuzete datoteke, internet stranicu/aplikaciju sa koje se pristupa (referrer URL), pretraživač koji koristite i, ako je potrebno, operativni sistem računara koji podržava internet, kao i ime vašeg provajdera. Navedene podatke server privremeno čuva u takozvanoj log datoteci u sledeće svrhe:\n\n– obezbeđivanje uspostavljanja nesmetane veze;\n\n– obezbeđivanje komfornog korišćenja naše internet stranice/aplikacije, odnosno internet stranica koje služe oglašavanju projekata Društva;\n\n– procena bezbednosti i stabilnosti sistema.\n\nPodaci se čuvaju privremeno i to za vreme posete stranici, a zatim se automatski brišu. Pravni osnov za obradu IP adrese je član 12, stav 1, tačka 6) Zakona o zaštiti podataka o ličnosti (legitiman interes), koji proizilazi iz gore navedene svrhe obrade podataka.\n\n### 2. Marketing i druge aktivnosti\n\nZa potrebe slanja komercijalnih poruka, kao i za potrebe realizacije marketing aktivnosti, podaci o ličnosti prikupljaju se isključivo na osnovu saglasnosti lica (na primer u slučaju prijave za newsletter, direktan marketing i sl.), tako da se ti podaci, koje ste nam dostavili putem kontakt obrasca, putem telefona ili putem e-mail adrese, koriste u skladu sa ovde utvrđenom svrhom. Ako ste dali pristanak za prijem newsletter-a preko e-mail adrese, SMS-a, Viber-a, i/ili za prijem drugog marketing materijala koji sadrži obaveštenje o aktuelnim ponudama i promocijama u vezi sa uslugama iz naše ponude, koristimo e-mail adresu, odnosno broj telefona, ime i prezime za slanje informacija o raspoloživim nepokretnostima, promocijama, novostima i ponudama za kupoprodaju nepokretnosti. Ove podatke čuvamo i obrađujemo u svrhu slanja komercijalnih poruka, newsletter-a i/ili drugog marketing materijala, koji uključuje akcije (ponude, promocije, itd.).\n\nPravni osnov za obradu podataka prilikom slanja komercijalnih poruka, newsletter-a i/ili drugog marketing materijala je vaša saglasnost u skladu sa članom 12, stav 1, tačka 1) Zakona o zaštiti podataka o ličnosti. Vašu saglasnost za prijem newsletter-a/marketing materijala možete da opozovete u svakom trenutku. Opoziv pristanka ne utiče na dopuštenost obrade koja je vršena na osnovu pristanka pre opoziva. To možete učiniti tako što ćete se npr. na našoj internet stranici, odnosno stranici koja služi za oglašavanje projekata Društva, odjaviti sa liste za prijem newsletter-a. Link za odjavu newsletter-a možete naći na kraju svakog newsletter-a, a odjavu za Viber ili SMS možete izvršiti direktno putem Viber aplikacije ili SMS poruke, ukoliko ste dali saglasnost za ovakav vid obaveštenja. Ukoliko opozovete pristanak, obrisaćemo vaše podatke. Obaveštavamo Vas da u slučaju slanja newsletter-a/Viber/SMS poruka možemo da angažujemo eksterne partnere u cilju izvršenja ovih usluga, tako da može da dođe do prenosa Vaših podataka tim licima (podaci o e-mail adresi i broju telefona).\n\n### 3. Podaci o ličnosti kupaca nepokretnosti\n\nDruštvo obrađuje lične podatke lica koji su potrebni za pripremu, zaključenje ugovora i izvršenje ugovornih obaveza, odnosno ostvarivanje prava i obaveza iz zaključenih ugovora o kupoprodaji nepokretnosti u okviru stambeno-poslovnog kompleksa. Lični podaci koje prikupljamo od Vas su: ime i prezime, adresa (ulica, kućni broj, poštanski broj, mesto, država), JMBG, broj lične karte/pasoša, kopije ličnih dokumenata i kontakt podaci (broj telefona, e-mail adresa). Sve vaše lične podatke dobijamo direktno od Vas.\n\nPored Ugovora o kupoprodaji nepokretnosti, Društvo može sa vama zaključivati i ugovore koji se zaključuju u fazi koja prethodi procesu kupoprodaje, kao što su ugovori o rezervaciji nepokretnosti, ugovori o depozitu za kupovinu nepokretnosti i sl., i u tom slučaju prikupljamo od Vas sledeće podatke: ime i prezime, adresu (ulica, kućni broj, poštanski broj, mesto, država), kao i kontakt podatke (broj telefona, e-mail adresa). Obradu vaših podataka vršimo za svrhu pripreme Ugovora o kupoprodaji nepokretnosti, kao i pripreme, zaključenja i drugih ugovora navedenih u ovom odeljku. Pravni osnov za obradu ovih podataka je član 12, stav 1, tačka 2) i 3) Zakona, imajući u vidu izvršenje ugovornih obaveza, odnosno pravnih obaveza.\n\n### 4. Ostali podaci o ličnosti koje ste nam Vi dali\n\nObrađujemo one lične podatke koje ste nam Vi dobrovoljno dali prilikom ostvarenja inicijalnog kontakta, prilikom kasnije komunikacije (npr. kroz telefonski poziv, e-poštu, upitnike, itd.), prilikom posete internet stranici Društva ili stranica koje služe oglašavanju projekata Društva ili profilima na društvenim mrežama, kao i one lične podatke koji su proizašli iz naše komunikacije ili poslovne saradnje, a koji uključuju Vaše identifikacione podatke (ime i prezime), kao i Vaše komunikacijske podatke (kontakt telefon i e-mail adresa). Vaše podatke obrađujemo u skladu sa utvrđenom svrhom, a kako bismo na osnovu Vašeg interesovanja odgovorili na Vaš upit, bliže Vam predstavili našu ponudu i dali druge zahtevane informacije.\n\nPravni osnov za obradu podataka je član 12, stav 1, tačka 6) Zakona o zaštiti podataka o ličnosti (legitimni interes). Naš i istovremeno Vaš (legitimni) interes za ovakvu obradu podataka proizilazi iz potrebe da odgovorimo na Vaša pitanja, da rešimo postojeće probleme ukoliko je neophodno, i na taj način obezbedimo Vaše zadovoljstvo kao korisnika naših usluga, odnosno kao korisnika naše internet stranice.\n\nAko učestvujete u nekoj od naših anketa/upitnika, takvo učestvovanje je dobrovoljno. Kod anonimnih anketa ne čuvamo podatke koji omogućavaju da zaključimo ko je učesnik ankete. Čuvamo samo datum i vreme vašeg učešća. Svaki lični podatak koji ste nam dali putem ankete smatramo dobrovoljno datim i čuvamo ih u skladu sa odredbama Zakona. U slučaju da ste dali saglasnost za sprovođenje ankete, pravni osnov za obradu podataka se zasniva na Vašem pristanku u skladu sa članom 12, stav 1, tačka 1) Zakona o zaštiti podataka o ličnosti. U tom slučaju, imate pravo da opozovete Vašu saglasnost u svakom trenutku. Opoziv pristanka ne utiče na dopuštenost obrade koja je vršena na osnovu pristanka pre opoziva.\n\nDostavljanjem ličnih informacija posetilac internet stranice Društva, odnosno internet stranice koja služi oglašavanju projekata Društva, razume i slaže se sa činjenicom da bezbednost, integritet i privatnost njegovih podataka ne može biti 100% garantovana, i pored toga što Društvo konstantno preduzima sve optimalne mere radi zaštite istih.\n\n### 5. Podaci o ličnosti korisnika društvenih mreža\n\nNa stranicama društvenih mreža Društva, Društvo obrađuje podatke u svrhu informisanja lica o poslovno-stambenom kompleksu, nepokretnostima čiju prodaju nudimo, uslugama koje pružamo, promocijama, bitnim informacijama, novostima u kompaniji, a sve u svrhu interakcije sa posetiocima društvenih mreža, kao i u svrhu davanja odgovora na postavljena pitanja, pohvale i kritike, i u svrhu komuniciranja sa licima zainteresovanim za naše usluge. Obrada podataka se vrši u interesu ostvarivanja komunikacije, odnosno u cilju interakcije i unapređenja odnosa sa pratiocima. Pravni osnov za obradu Vaših podataka je član 12, stav 1, tačka 6) Zakona (legitiman interes).\n\nNa obradu podataka od strane operatera platforma društvenih mreža (npr. administracija članova i deljenje informacija) imamo samo ograničen uticaj. Tamo gde možemo da utičemo i podesimo parametre za obradu Vaših podataka, i to tako da operater platforme društvenih mreža postupa u skladu sa zaštitom podataka, mi preduzimamo sve mere koje su nam na raspolaganju. Međutim, na mnogim mestima ne možemo da utičemo na obradu podataka operatera, niti znamo koje podatke operater tačno obrađuje. Operater platforme upravlja celom IT infrastrukturom usluge, pridržava se sopstvenih pravila o zaštiti podataka i ima sa Vama poseban korisnički odnos (ukoliko ste registrovani korisnik usluge društvenih mreža). Dodatno, operater je isključivo odgovoran za sva pitanja u odnosu na podatke Vašeg korisničkog profila, kojima mi, kao kompanija, nemamo pristup. Detaljnije informacije o obradi podataka od strane operatera platforma društvenih mreža i o mogućnostima prigovora možete pronaći u njihovim pravilima o zaštiti podataka.\n\nPodatke koje ste uneli na našim stranicama društvenih mreža, kao što su npr. komentari, video snimci, slike, lajkovi, javna obaveštenja i sl., objavljuje operater platforme, a mi ih ni u jednom trenutku ne obrađujemo u neku svrhu različitu od predviđene. Zadržavamo pravo da obrišemo nezakonite ili neprimerene sadržaje, ukoliko je to potrebno. Vaše podatke obrađujemo i u svrhu komuniciranja sa Vama. Vaše sadržaje ćemo eventualno podeliti na našoj stranici ako to predstavlja funkciju platforme društvene mreže.\n\n## Pristup Vašim podacima\n\nVaše lične podatke smatramo poslovnom tajnom, te ih kao takve štitimo u skladu sa važećim zakonskim propisima i najboljom praksom. Unutar naše kompanije, pristup podacima koje ste nam stavili na raspolaganje imaju samo one organizacione jedinice, odnosno oni zaposleni kojima su isti neophodni za ispunjenje svrhe za koju su podaci o ličnosti prikupljeni. Vaše lične podatke ćemo obrađivati mi sami, dok treća lica imaju pravo pristupa i obrade Vaših ličnih podataka samo u niže opisanim situacijama:\n\n– naši pouzdani partneri, odnosno pravna lica sa kojima poslovno sarađujemo i koja nam pomažu u redovnom poslovanju. To mogu biti lica koja razvijaju i održavaju IT rešenja i platforme, servere, kao i lica koja Vam pružaju usluge u ime Društva, npr. za marketinške svrhe. U tom slučaju ta pravna lica obrađuju Vaše lične podatke isključivo za naše potrebe. Ovi pružaoci usluga su, u skladu sa zaključenim ugovorima, u obavezi da koriste podatke koji su im povereni isključivo u skladu s našim uputstvima, i strogo za svrhu koju smo opredelili, uz obavezu da adekvatno zaštite Vaše podatke i da ih drže u tajnosti;\n\n– lica s kojima poslovno sarađujemo, kada ocenimo da je to potrebno radi zaštite naših određenih i opravdanih interesa, npr. poreski savetnici, računovođe, osiguravajuće kuće, advokati i drugi savetnici. U tom slučaju, ta lica obrađuju Vaše lične podatke isključivo za naše potrebe;\n\n– nadležna tela kod sprovođenja nadzora nad zakonitošću poslovanja i postupanja, kao i druga pravna lica kad je to potrebno za izvršenje neke naše zakonske dužnosti, npr. revizor. U tom slučaju ta pravna lica obrađuju Vaše lične podatke u svrhu koja im je zakonom dodeljena;\n\n– ostale strane u vezi s poslovnim transakcijama, kao što su npr. prodaja društva ili dela društva, reorganizacija, spajanje, zajedničko ulaganje ili bilo koja druga vrsta raspolaganja našim društvom ili imovinom.\n\nTakođe, može postojati potreba da deo Vaših upita prosledimo ugovornim partnerima (npr. dobavljačima, arhitektama ili izvođačima radova kod upita u vezi specifičnih proizvoda/materijala i sl.), a u svrhu obrade Vašeg upita. Međutim, u tim slučajevima se upit prethodno anonimizira, tako da treće lice ne može da ih dovede ni u kakvu vezu sa Vama. Ukoliko u pojedinačnom slučaju prosleđivanje Vaših ličnih podataka bude neophodno, mi ćemo Vas o tome prethodno obavestiti i zatražićemo Vašu saglasnost. Treće strane su ograničene u mogućnosti korišćenja Vaših ličnih podataka u bilo koje druge svrhe, osim navedenih, te su u obavezi da štite i obrađuju Vaše lične podatke u skladu sa zakonskim, regulatornim i ugovornim obavezama. Sva pravna lica sa kojima sarađujemo su izabrana na veoma pažljiv način i, kada to nalaže zakon, ista su ugovorom obavezana na čuvanje ličnih podataka u tajnosti, a u skladu sa članom 45 Zakona o zaštiti podataka o ličnosti.\n\n## Prenos Vaših ličnih podataka u druge države\n\nU pojedinim slučajevima možemo da delimo Vaše podatke o ličnosti, odnosno da ih prenosimo u druge države u skladu sa Zakonom. Kada to činimo, prenosimo Vaše podatke na servere koji se nalaze u EU ili u zemlji koja obezbeđuje adekvatan nivo zaštite u skladu sa zakonodavstvom Republike Srbije. Pristup će biti dozvoljen samo ograničenom broju lica, odnosno ovlašćenim osobama, isključivo za održavanje funkcionalnosti servera.\n\n## Način na koji štitimo Vaše lične podatke\n\nNeke od mera zaštite koje sprovodimo su sledeće:\n\n– primena savremenih metoda zaštite i kontrole pristupa izvorima podataka koji sadrže lične podatke;\n\n– ograničenje pristupa osetljivim podacima, kao i ograničenje korisničkih naloga koji mogu imati pristup određenim podacima, uvodeći sistem rola i autorizacija koje će da obezbede da samo određeni zaposleni rukovaoci kojima je neophodan pristup podacima za obavljanje radnih zadataka mogu da imaju uvid i vrše obradu odgovarajućih podataka;\n\n– kontinuirani nadzor nad svim resursima (fizičkim prostorima gde se Vaši podaci čuvaju) koji se koriste za obradu ličnih podataka.\n\nSvrha sprovođenja navedenih mera je sprečavanje rizika od uništenja, gubitka, izmene, neovlašćenog otkrivanja ili pristupa Vašim ličnim podacima. Korišćenje odgovarajućih mera zaštite, u odnosu na Vaše lične podatke, tražimo i od trećih osoba koje imaju pravo pristupa i obrade Vaših ličnih podataka. Svi podaci o ličnosti se čuvaju na našem serveru u Republici Srbiji. Napominjemo da se gore navedene mere zaštite ne odnose na informacije, odnosno podatke koje izaberete da delite u javnosti preko društvenih mreža ili aplikacija za razmenu poruka.\n\n## Period čuvanja Vaših ličnih podataka\n\nPodaci o ličnosti se čuvaju onoliko vremena koliko je potrebno za obezbeđivanje svrhe za koju su podaci o ličnosti prikupljeni. Ukoliko ste sa nama zaključili ugovor, podatke čuvamo dok traju prava i obaveze iz ugovora, a nakon toga onoliko dugo koliko to zahtevaju primenjivi propisi. Vaše podatke o ličnosti zadržavamo i nakon raskida ugovornog odnosa ako su nam Vaši podaci potrebni za utvrđivanje, ostvarivanje ili odbranu pravnih zahteva ili usaglašavanje sa merodavnim zakonima. U meri u kojoj je to moguće, ograničićemo obradu vaših podataka o ličnosti u te ograničene svrhe nakon prestanka ugovornog odnosa. Nakon ispunjenja svrhe, odnosno nakon isteka zakonom propisanog roka za čuvanje podataka o ličnosti, podaci o ličnosti će biti trajno obrisani.\n\n## Vaša prava\n\nAko odlučite da se koristite jednim ili više od svojih niže navedenih prava, imamo pravo proveriti Vaš identitet, sve u svrhu zaštite ličnih podataka. Vaša prava ostvarujete besplatno. Izuzetno, ako je Vaš zahtev očigledno neosnovan ili preteran (npr. tražite lične podatke koje i sami posedujete), a posebno ako se isti zahtev učestalo ponavlja, imamo pravo da naplatimo nužne troškove postupanja po Vašem zahtevu ili da odbijemo da postupimo po Vašem zahtevu. Molimo Vas da sva pitanja i zahteve vezane za Vaša prava u pisanom obliku šaljete na adresu navedenu u odeljku Podaci o rukovaocu. Na Vaš zahtev ćemo odgovoriti odmah, a najkasnije u roku od mesec dana, osim ako izuzetna složenost pojedinačnog slučaja zahteva produženje navedenog roka. Da bismo Vas zaštitili kao titulara ličnih podataka, potrebno je da se na odgovarajući način identifikujete kao podnosilac prijave, što će za Društvo predstavljati jemstvo da lične podatke daje njihovom vlasniku.\n\n**Pristup Vašim ličnim podacima**\n\nImate pravo da od nas tražite informaciju o tome da li obrađujemo Vaše podatke o ličnosti, pristup tim podacima, kao i informacije o obradi u skladu sa članom 26. Zakona.\n\n**Ispravka netačnih, dopuna, brisanje i ograničenje upotrebe ličnih podataka**\n\nImate pravo da tražite ispravku Vaših netačnih ličnih podataka, kao i pravo da dopunite, brišete i ograničite upotrebu Vaših ličnih podataka.\n\n**Prenosivost ličnih podataka**\n\nImate pravo da preuzmete i tražite prenos Vaših ličnih podataka.\n\n**Pravo na povlačenje saglasnosti i zaborav**\n\nImate pravo da povučete Vašu saglasnost za obradu ličnih podataka, kao i da tražite da se trajno brišu Vaši lični podaci koje smo obrađivali na osnovu Vaše saglasnosti.\n\n**Prigovor protiv obrade ili postupanja s Vašim ličnim podacima**\n\nImate pravo prigovora na obradu Vaših ličnih podataka, kao i uopšteno na naš način postupanja s Vašim ličnim podacima. Vaš zahtev nam pošaljite putem e-pošte na adresu navedenu u odeljku Podaci o rukovaocu, gde u naslovu poruke navodite „Prigovor protiv obrade\", a u samoj poruci objašnjavate razlog prigovora i Vaš zahtev.\n\n**Pravo na pritužbu Povereniku za informacije od javnog značaja i zaštitu podataka o ličnosti**\n\nU svakom trenutku imate pravo na pritužbu pred nadležnim organom za zaštitu ličnih podataka – Poverenikom za informacije od javnog značaja i zaštitu podataka o ličnosti ([https://www.poverenik.rs/](https://www.poverenik.rs/)).\n\n## Izmene politike privatnosti\n\nDruštvo zadržava pravo da bilo kada izmeni ova pravila privatnosti. Svaka izmena postaje važeća nakon njenog objavljivanja na internet stranici Društva ili na drugi adekvatan način. S tim u vezi, preporučujemo Vam da redovno vršite proveru odeljka koji se odnosi na Politiku privatnosti kako biste imali najnovije informacije.\n\nBeograd, 02.11.2025.\n\n*Napomena: Nakon završetka materijalizacije projekta može doći do manjih odstupanja u izgledu fasade ili detalja u odnosu na prikazane rendere. Numeracija prostorija izvedena je u skladu sa načinom evidentiranja nekretnina u katastru Republike Srbije.*"])</script><script>self.__next_f.push([1,"11:[\"$\",\"$L12\",null,{\"formats\":\"$undefined\",\"locale\":\"sr\",\"messages\":{\"Contact\":{\"title\":\"Pošaljite\",\"request\":\"upit\",\"description\":\"Za više informacija o raspoloži :\"Lokal\",\"office\":\"Kancelarija\",\"basement\":\"Podrum\",\"groundFloor\":\"Prizemlje\",\"layout\":\"Raspored\",\"floor\":\"Sprat\",\"floorNumber\":\"sprat {floor}\",\"size\":\"Kvadratura\",\"type\":\"Tip\",\"wing\":\"Lamela\",\"businessSpace\":\"Poslovni prostor\",\"submitRequest\":\"Pošaljite zahtev\",\"description\":\"Promišljeno dizajnirani poslovni prostori sa maksimalnom vidljivošću i odličnom povezanošću. Fleksibilni rasporedi prilagođavaju se potrebama Vašeg poslovanja, bilo da razvijate postojeću kompaniju ili otvarate novu lokaciju.\",\"share\":\"Podeli\",\"copied\":\"Kopirano!\",\"resetFilters\":\"Resetuj filtere\",\"results\":\"Rezultati\"}},\"AboutInvestor\":{\"Hero\":{\"heading\":\"O INVESTITORU\",\"tag\":\"Perose Property Group\",\"paragraph\":\"Perose Property Group je holding kompanija, specijalizovana za razvoj, investicije i upravljanje stambenim i poslovnim projektima širom Srbije. Naš portfolio obuhvata projekte kao što su: AD Residence u Zemunu, Harmony Homes, Stari Mlin i Old City Residence u Kragujevcu.\",\"cta\":\"Kontaktirajte nas\"},\"Static1\":{\"heading\":\"Svaki naš projekat odlikuju savremena arhitektura, visoki standardi gradnje i pažljivo odabrane lokacije koje pružaju dugoročnu vrednost vlasnicima stanova i poslovnih prostora.\",\"paragraph\":\"Naša misija je stvaranje trajne vrednosti kroz inovativan i održiv razvoj koji unapređuje urbane sredine i poboljšava kvalitet života.\"},\"Projects\":{\"projects\":[{\"name\":\"Belgrade Arbor\",\"location\":\"BEOGRAD\",\"image\":\"/about-the-investor/slide1.webp\",\"descriptions\":[\"Belgrade Arbor jedan je od naših najvećih  projekata i predstavlja viziju kojom se vodimo, a to je da svaki kvadratni metar treba da ima svoju svrhu i doprinese funkcionalnosti, kvalitetu i vrednosti prostora. Kroz dosledan pristup dizajnu, pažljiv odabir partnera i posvećenost svakom detalju, stvaramo moderan kompleks mešovite namene, koji odgovara savremenim potrebama života i poslovanja, istovremeno doprinoseći razvoju urbanog identiteta Beograda.\"]},{\"name\":\"AD Residence\",\"location\":\"BEOGRAD\",\"image\":\"/about-the-investor/slide6.webp\",\"descriptions\":[\"AD Residence je savremeni stambeno-poslovni kompleks, smešten u mirnom delu Zemuna, osmišljen tako da spoja kvalitetnu gradnju, funkcionalan dizajn i udobnost svakodnevnog života. Projekat obuhvata dve lamele sa raznovrsnom ponudom stambenih jedinica i poslovnih prostora, uz prostranu podzemnu garažu na tri nivoa. Zahvaljujući pažljivo odabranoj lokaciji, blizini Dunava i odličnoj povezanosti sa ostatkom grada, AD Residence predstavlja idealan izbor za sve koji žele moderan dom u mirnom okruženju, bez odricanja od svih prednosti urbanog života.\"]},{\"name\":\"Harmony Homes\",\"location\":\"Kragujevac\",\"image\":\"/about-the-investor/slide2.webp\",\"descriptions\":[\"Harmony Homes je moderan stambeni kompleks u Kragujevcu, smešten između ulica Gavrila Principa i Daničićeve. Projekat obuhvata dve zgrade sa ukupno 86 stanova, poslovnim prostorom i pažljivo uređenim zelenim površinama namenjenim prijatnom porodičnom životu.\",\"Kako bi svakodnevica stanara i posetilaca bila što jednostavnija, kompleks nudi prostrane parking kapacitete, uključujući sigurnu podzemnu garažu i dostupna parking mesta. Savremena arhitektura i funkcionalni rasporedi stanova stvaraju ravnotežu između urbanog načina života i udobnosti modernog doma.\"]},{\"name\":\"Stari Mlin\",\"location\":\"Kragujevac\",\"image\":\"/about-the-investor/slide4.webp\",\"descriptions\":[\"Projekat Stari Mlin, koji razvija Perose Real Estate na adresi Dr Jovana Ristića 170 u Kragujevcu, predstavlja savremeni stambeno-poslovni  kompleks, izgrađen na mestu nekadašnjeg gradskog mlina, čuvajući duh istorijske lokacije kroz spoj tradicije i moderne arhitekture.\",\"Projekat trenutno obuhvata dve zgrade u izgradnji, sa ukupno 34 stana, dva poslovna prostora i 42 parking mesta. Planirana treća zgrada, koja je trenutno u fazi projektovanja, dodatno će obogatiti kompleks podzemnom garažom i još 12 stambenih jedinica. Završetak projekta planiran je krajem 2027. godine, a Stari Mlin će spojiti lokalno nasleđe i savremeni dizajn, pružajući kvalitetan urbani život i pažljivo osmišljene prostore za budućnost.\"]},{\"name\":\"Old City Residence\",\"location\":\"Kragujevac\",\"image\":\"/about-the-investor/slide3.webp\",\"descriptions\":[\"Old City Residence je značajan projekat, planiran na atraktivnoj lokaciji u Kragujevcu. Početak izgradnje planiran je krajem 2026. godine, a projekat objedinjuje savremenu arhitekturu i promišljen koncept prostora, stvarajući dinamično okruženje prilagođeno modernom načinu života i poslovanja.\",\"Kompleks će obuhvatiti 169 stambenih jedinica, više poslovnih prostora i 222 garažna mesta raspoređena na dve podzemne etaže, pružajući visok nivo komfora i praktičnosti budućim stanarima i korisnicima prostora.\"]},{\"name\":\"Centar Crvenog krsta\",\"location\":\"Kragujevac\",\"image\":\"/about-the-investor/slide5.webp\",\"descriptions\":[\"Novi Centar Crvenog krsta u Kragujevcu, razvijen u saradnji sa Gradskom organizacijom Crvenog krsta, predstavlja savremeno i funkcionalno rešenje koje zamenjuje postojeće neadekvatne kapacitete. Smešten na uglu ulica Vojvode Putnika 4 i Luja Pastera, objekat površine 1.198 m² biće u potpunosti prilagođen potrebama korisnika, kroz rekonstrukciju i proširenje postojećeg prostora.\",\"Novi centar će obuhvatiti moderne kancelarije, javnu kuhinju, prostorije namenjene humanitarnim programima, kao i posebno opremljene zone za obuku volontera, čime će dodatno unaprediti kapacitete organizacije i njenu podršku lokalnoj zajednici.\"]}]},\"Static2\":{\"heading\":\"Perose Property Group - Verujemo da kvalitetni projekti nastaju kroz posvećenost kvalitetu, odgovoran pristup i dugoročno promišljanje.\",\"description\":\"Kroz svaki stambeni i/ili poslovni i projekat koji gradimo, cilj je da stvaramo prostore koji donose dugoročnu vrednost, unapređuju urbano okruženje i doprinose kvalitetnijem svakodnevnom životu ljudi koji ih koriste.\",\"description2\":\"Kako nastavljamo da rastemo, ostajemo posvećeni principima koji definišu naš rad - pažljivom planiranju, visokim standardima gradnje, održivom razvoju i posvećenosti svakom detalju. U budućnosti ćemo nastaviti da ulažemo u inovativne projekte koji doprinose razvoju gradova u Srbiji i stvaraju zajednice prilagođene generacijama koje dolaze.\"}},\"RetailSpaces\":{\"Hero\":{\"heading\":\"LOKALI\",\"paragraph\":\"Prestižna adresa na kojoj poslovanje dobija novu dimenziju. Lokali i ugostiteljski sadržaji u prizemlju, uz fleksibilne poslovne prostore na višim etažama, pažljivo su osmišljeni kako bi odgovorili na potrebe savremenog poslovanja. Prepoznatljiva arhitektura, obilje prirodne svetlosti i odlična povezanost sa srcem Novog Beograda stvaraju okruženje koje podstiče rast, saradnju i poslovni uspeh.\"}},\"FiltersResidence\":{\"filters\":\"Filteri\",\"all\":\"Sve\",\"features\":\"Dodatno\",\"garden\":\"Bašta\",\"balcony\":\"Balkon\",\"wing\":\"Lamela\",\"floor\":\"SPRAT\",\"resetFilters\":\"Resetuj filtere\",\"results\":\"Rezultati\",\"seeMore\":\"Učitaj više\",\"noResults\":\"Nema rezultata za izabrane filtere.\"},\"FiltersRetail\":{\"heading\":\"Filteri\",\"floor\":\"SPRAT\",\"all\":\"Svi\",\"offices\":\"Kancelarije\",\"retail\":\"Lokali\",\"wing\":\"Lamela\",\"resetFilters\":\"Resetuj filtere\",\"results\":\"Rezultati\",\"seeMore\":\"Učitaj više\",\"noResults\":\"Nema rezultata za izabrane filtere.\"},\"ResidenceCard\":{\"rooms\":\"broj soba\",\"floor\":\"sprat\",\"basement\":\"Podrum\",\"groundFloor\":\"Prizemlje\",\"seeMore\":\"Vidi više\"},\"RetailCard\":{\"basement\":\"Podrum\",\"groundFloor\":\"Prizemlje\",\"floor\":\"sprat\"},\"Business\":{\"Hero\":{\"heading\":\"POSLOVNI PROSTORI\",\"subheading\":\"Zakoračite ka novim poslovnim uspesima na adresi Belgrade Arbor!\",\"paragraph\":\"U savremenom poslovnom svetu, poslovni prostor predstavlja mnogo više od mesta za rad. Poslovni prostor odražava identitet kompanije, podstiče inovacije i stvara uslove za dugoročan rast. Zato, uspešne kompanije biraju lokacije koje spajaju prestižnu adresu, vrhunsku funkcionalnost, fleksibilne poslovne prostore i odličnu povezanost sa najvažnijim poslovnim centrima. Belgrade Arbor pruža upravo takvo okruženje - savremeni poslovni ambijent osmišljen da podrži razvoj Vašeg poslovanja, unapredi svakodnevni rad i ostavi snažan utisak na zaposlene, klijente i poslovne partnere. Vaš naredni poslovni uspeh počinje upravo ovde.\",\"cta\":\"Pogledajte promo video\"},\"Introduction\":{\"Screen1\":{\"tag\":\"Izuzetna povezanost sa svim delovima grada\",\"heading\":\"Poslovni prostori u okviru Belgrade Arbor pažljivo su osmišljeni za kompanije koje traže ekskluzivnu lokaciju, vrhunsku funkcionalnost i dugoročnu vrednost.\"},\"Screen2\":{\"paragraph1\":\"Smešten u srcu poslovne zone na Novom Beogradu, Belgrade Arbor nalazi se u neposrednoj blizini ključnih poslovnih centara - Airport City kompleksa* i Hangara*. Odlična povezanost sa železničkom stanicom Tošin bunar, kao i brz pristup Aerodromu „Nikola Tesla“, čine ovu lokaciju idealnim izborom za kompanije.\",\"paragraph2\":\"Dodatnu vrednost lokaciji daje i blizina Osnovne škole „Savremena“, koja pruža moderno, podsticajno i inovativno okruženje za obrazovanje Vaših najmlađih.\",\"note1\":\"*Airport City Belgrade je najprestižniji poslovni kompleks mešovite namene i najveći poslovni park u Srbiji.\",\"note2\":\"*Hangar je savremena urbana destinacija koja objedinjuje restorane, prostore za događaje i sadržaje namenjene kreativnim industrijama.\"},\"Screen3\":{\"heading\":\"Savremena arhitektura i sofisticirani enterijer\",\"paragraph\":\"Pažljivo osmišljeni kancelarijski prostori, atraktivna lokacija na Novom Beogradu i sadržaji koji olakšavaju svakodnevno poslovanje čine Belgrade Arbor idealnim mestom za razvoj Vašeg biznisa. Izaberite poslovno okruženje u kojem se funkcionalnost, profesionalni imidž i kvalitet radnog iskustva prirodno dopunjuju.\",\"cta\":\"Istraži prostore\"}},\"BusinessSpacesOptions\":{\"businessSpaces\":[{\"name\":\"Lamela A\",\"unitsAvailable\":11,\"description\":\"Prilagodljiv raznim tipovima biznisa, sa optimalnim rasporedom i prirodnim osvetljenjem koje podstiče produktivnu radnu atmosferu.\"},{\"name\":\"Lamela B\",\"unitsAvailable\":11,\"description\":\"Komforno i funkcionalno, pogodno za kancelarije, kоuorking ili šou-rumove, uz lak pristup i profesionalno okruženje.\"},{\"name\":\"Lamela V\",\"unitsAvailable\":9,\"description\":\"Nalazi se duž reprezentativnog, impresivnog ulaza sa staklenom fasadom. Ova poslovna lamela nema stambenih jedinica, što poslovnim zakupcima omogućava dodatni nivo privatnosti i profesionalnog ambijenta.\"},{\"name\":\"Lokali\",\"unitsAvailable\":18,\"description\":\"Kompleks Belgrade Arbor raspolaže sa 18 lokala i ugostiteljskih prostora ravnomerno raspoređenih kroz A i B vertikalu. Svi prostori se nalaze u prizemlju, na uličnoj fasadi zgrade, što omogućava maksimalnu vidljivost i direktan pristup sa ulice.\"}],\"office\":\"poslovnih\",\"spaces\":\"prostora\",\"brochure\":\"BROŠURA\",\"inquire\":\"Pošalji upit\",\"mobileTag\":\"Poslovni prostori\"},\"Panorama\":{\"heading\":\"Trenuci uživanja i gastronomski doživljaji sa panoramskim pogledom\",\"paragraph1\":\"Belgrade Arbor pruža pažljivo osmišljene sadržaje u okviru kompleksa, uključujući kafe-restoran na najvišoj povučenoj etaži, kao i odličnu povezanost sa brojnim poslovnim i komercijalnim sadržajima u neposrednoj blizini.\",\"paragraph2\":\"Sve to doprinosi stvaranju zaokruženog poslovnog okruženja u kojem se svakodnevni rad, sastanci i poslovne aktivnosti odvijaju jednostavno i efikasno, na jednoj adresi.\",\"paragraph3\":\"Autentičnost prostora dodatno naglašava otvoren panoramski pogled na Novi Beograd, stvarajući idealan ambijent za neformalne sastanke, povezivanje i razgovore u prijatnom i inspirativnom okruženju.\",\"cta\":\"Istraži prostore\"}},\"SingleBusinessSpac :\"Prostrani dnevni boravak, privatna spavaća soba i dodatna polusoba koja može biti radna soba, gostinjska soba ili dečja soba. Fleksibilni kvadrati za domaćinstva kojima treba malo više prostora.\",\"three\":\"Dom sa prostranim dnevnim boravkom i trpezarijom, dve spavaće sobe i terasom koja upotpunjuje svakodnevni život. Funkcionalan raspored i prirodna svetlost sa više strana stvaraju prijatan ambijent za porodicu, odmor i zajedničke trenutke.\",\"four\":\"Jedan od najvećih stanova u okviru projekta koji pruža obilje prostora za udoban porodični život. Prostran dnevni boravak, tri spavaće sobe i velika terasa, što ga čine ih idealnim izborom za one koji žele više prostora, više komfora i dom koji se prilagođava svim potrebama. \"}},\"Message\":{\"tag\":\"Po Vašoj meri\",\"heading\":\"Svaki stan u Belgrade Arboru oblikovan je prema Vašem načinu života, sa pažljivo osmišljenim rasporedom koji pruža maksimalnu funkcionalnost, obilje prirodne svetlosti i prefinjene materijale, odabrane tako da zadrže svoju lepotu i kvalitet kroz vreme.\",\"paragraph\":\"Dvostrana orijentacija ispunjava enterijer svetlošću iz više pravaca i otvara pogled ka panorami Novog Beograda. Prigušeni tonovi, nežne linije i pažljivo kreirani prostori stvaraju atmosferu mira, udobnosti i lakoće, čineći svaki dom mestom u kojem se svakodnevni život odvija prirodno i bez kompromisa.\"},\"Gallery\":{\"heading\":\"Galerija\"},\"Similar\":{\"heading\":\"Slični\",\"cta\":\"Pogledaj više\"}},\"Home\":{\"Introduction\":{\"Screen1\":{\"tag\":\"BELGRADE ARBOR DIZAJN\",\"heading\":\"Vizuelni identitet Belgrade Arbora oblikovan je prepoznatljivom, elegantnom fasadom koja podseća na krošnju drveta - simbol rasta, harmonije i dugovečnosti.\",\"cta\":\"Pogledaj u 3D\"},\"Screen2\":{\"heading\":\"Belgrade Arbor nije samo još jedno obeležje gradskog horizonta, već pažljivo kreiran urbani ekosistem koji živi i razvija se u ritmu grada.\",\"cta\":\"Pogledaj u 3D\"},\"Screen3\":{\"heading\":\"Novo poglavlje prestiž
