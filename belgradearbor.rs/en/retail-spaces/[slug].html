tage with modern architecture to deliver high-quality urban living and long-term value.\"]},{\"name\":\"Old City Residence\",\"location\":\"Kragujevac\",\"image\":\"/about-the-investor/slide3.webp\",\"descriptions\":[\"Old City Residence is a landmark mixed-use development planned for a prime location in Kragujevac. Scheduled to break ground in late 2026, the project combines modern architecture with long-term value, creating a vibrant environment for contemporary lifestyles and businesses.\",\"The development will feature 169 residential units, multiple commercial spaces, and 222 garage parking spaces distributed across two underground levels to ensure maximum convenience for future residents and visitors.\"]},{\"name\":\"Red Cross Center\",\"location\":\"Kragujevac\",\"image\":\"/about-the-investor/slide5.webp\",\"descriptions\":[\"Developed in cooperation with the City Red Cross Organization, the new Red Cross Center in Kragujevac replaces outdated facilities with a modern, functional space. Located at Vojvode Putnika 4 and Luja Pastera Street, the 1,198 m² fully accessible development includes the reconstruction and expansion of the existing building.\",\"The new hub will feature modern offices, a public kitchen, spaces for humanitarian programs, and dedicated areas for volunteer training, strengthening the organization's capacity to serve the local community.\"]}]},\"Static2\":{\"heading\":\"At Perose Property Group, we believe that successful developments are built on a foundation of quality, responsibility, and long-term vision.\",\"description\":\"Through every residential, commercial, and mixed-use project we undertake, our goal is to create spaces that deliver lasting value, enhance urban environments, and improve the everyday lives of the people who use them.\",\"description2\":\"As we continue to grow, we remain committed to the same principles that define our work today - thoughtful planning, high construction standards, sustainable development, and attention to detail. Looking ahead, we will continue to invest in innovative projects that contribute to the future of Serbia's cities while building communities designed for generations to come.\"}},\"RetailSpaces\":{\"Hero\":{\"heading\":\"BUSINESS SPACES\",\"paragraph\":\"A prestigious address where business feels at home. Street-level retail and hospitality units meet flexible offices above, each shaped by refined architecture, natural light, and direct access to the heart of New Belgrade.\"}},\"FiltersResidence\":{\"filters\":\"Filters\",\"all\":\"All\",\"features\":\"Features\",\"garden\":\"Garden\",\"balcony\":\"Balcony\",\"wing\":\"Wing\",\"floor\":\"FLOOR\",\"resetFilters\":\"Reset Filters\",\"results\":\"Results\",\"seeMore\":\"See more\",\"noResults\":\"No results for the selected filters.\"},\"FiltersRetail\":{\"heading\":\"Filters\",\"floor\":\"FLOOR\",\"all\":\"All\",\"offices\":\"Offices\",\"retail\":\"Retail\",\"wing\":\"Wing\",\"resetFilters\":\"Reset filters\",\"results\":\"Results\",\"seeMore\":\"See more\",\"noResults\":\"No results for the selected filters.\"},\"ResidenceCard\":{\"rooms\":\"rooms\",\"floor\":\"floor\",\"basement\":\"Basement\",\"groundFloor\":\"Ground floor\",\"seeMore\":\"See more\"},\"RetailCard\":{\"basement\":\"Basement\",\"groundFloor\":\"Ground floor\",\"floor\":\"floor\"},\"Business\":{\"Hero\":{\"heading\":\"BUSINESS SPACES\",\"subheading\":\"Step Into New Successes at Belgrade Arbor Address!\",\"paragraph\":\"In modern business, a workspace is more than just walls - it defines a company's identity, culture, and future. Seeking an environment that inspires teams, facilitates collaboration, and supports growth, companies look for locations that combine prestige, functionality, flexible layouts, and connectivity to key business hubs. We believe Belgrade Arbor is the perfect answer to your business needs.\",\"cta\":\"View promo video\"},\"Introduction\":{\"Screen1\":{\"tag\":\"Exceptional Connectivity Across the City\",\"heading\":\"The office spaces at Belgrade Arbor are carefully designed for companies seeking an exclusive location, functionality, and long-termvalue.\"},\"Screen2\":{\"paragraph1\":\"Situated in the heart of New Belgrade's most dynamic business district, the complex is just steps away from key postal centers, Airport City* and Hangar*. With immediate access to the Tošin bunar railway station and excellent connections to Nikola Tesla Airport, Belgrade Arbor is the ideal choice for businesses that value both image andaccessibility.\",\"paragraph2\":\"Another advantage is the nearby Savremena Elementary School, offering access to a modern, stimulating and innovativeeducation.\",\"note1\":\"*Airport City Belgrade is the most prestigious multi-purpose business facility and the largest business park inSerbia.\",\"note2\":\"*Hangar is a vibrant urban destination combining restaurants, event spaces, and creative venues.\"},\"Screen3\":{\"heading\":\"Contemporary Architecture \u0026 Sophisticated Interiors\",\"paragraph\":\"With thoughtfully designed office spaces, an exceptional location in New Belgrade, and top-notch amenities within the complex, Belgrade Arbor offers workspaces where productivity, professional image, and the everyday work experience come together in a unique businessecosystem.\",\"cta\":\"Explore spaces\"}},\"BusinessSpacesOptions\":{\"businessSpaces\":[{\"name\":\"Wing A\",\"unitsAvailable\":11,\"description\":\"Adaptable to various types of businesses, with an optimal layout and natural lighting that fosters a productive work atmosphere.\"},{\"name\":\"Wing B\",\"unitsAvailable\":11,\"description\":\"Comfortable and functional, suitable for offices, coworking, or showrooms, with easy access and a professional environment.\"},{\"name\":\"Wing V\",\"unitsAvailable\":9,\"description\":\"Located along an impressive, representative entrance with a glass curtain wall. This business wing contains no residential units, offering business tenants an added level of privacy and a professional setting.\"},{\"name\":\"Retail\",\"unitsAvailable\":18,\"description\":\"Belgrade Arbor complex features 18 retail and hospitality units distributed evenly across Wing A and Wing B. All premises are situated on the ground floor at the building's front, ensuring maximum visibility and direct street access.\"}],\"office\":\"office\",\"spaces\":\"spaces\",\"brochure\":\"BROCHURE\",\"inquire\":\"Inquire\",\"mobileTag\":\"Business spaces\"},\"Panorama\":{\"heading\":\"Favorite Rituals and Culinary Experiences with Panoramic View\",\"paragraph1\":\"Belgrade Arbor features top-notch amenities within the complex, including a café restaurant on the top recessed floor, as well as close proximity to other business and commercial areas.\",\"paragraph2\":\"All of this contributes to creating a complete business ecosystem, where work, meetings, and all operational processes take place in one convenient location.\",\"paragraph3\":\"The space's authenticity and charm are elevated by an open panoramic view of New Belgrade, creating an ideal setting for informal meetings, networking, and engaging conversations in a pleasant and inspiring atmosphere.\",\"cta\":\"Explore spaces\"}},\"SingleBusinessSpace\":{\"Hero\":{\"office\":\"Office\",\"retail\":\"Retail\",\"size\":\"Size\",\"floor\":\"Floor\",\"type\":\"Type\",\"description\":\"Thoughtfully designed commercial spaces with maximum visibility and excellent connectivity. Flexible layouts adapt to your business needs, whether you are growing a company or opening a new location.\",\"wing\":\"Wing\",\"submitRequest\":\"Submit a request\",\"share\":\"Share\",\"copied\":\"Copied!\",\"windowPrompt\":\"Copy this link:\",\"back\":\"Back\",\"layout\":\"Layout\",\"floorPlan\":\"floor\",\"basement\":\"Basement\",\"groundFloor\":\"Ground floor\",\"officeDescription\":\"Office spaces designed for a variety of business ideas and needs, featuring an excellent location, high visibility, and modern design that leaves a strong impression. The flexible layout allows you to shape the space according to your way of doing business—whether you're developing an existing company, expanding your team, or starting a new business venture.\",\"retailDescription\":\"Retail units designed for a variety of business ideas and needs, featuring an excellent location, high visibility, and modern design that leaves a strong impression. The flexible layout allows you to shape the space according to your way of doing business—whether you're developing an existing company, expanding your team, or starting a new business venture.\"},\"Message\":{\"tag\":\"Vision\",\"heading\":\"At Belgrade Arbor, your business takes root at one of New Belgrade's most prestigious addresses. Flexible retail units and offices, shaped by refined architecture and natural light, ready to be tailored to the way you work.\",\"paragraph\":\"Flexible layouts allow you to shape the space according to your way of doing business—whether you're developing an existing company, expanding your team, or starting a new business venture.\"},\"Gallery\":{\"heading\":\"Gallery\"},\"Similar\":{\"heading\":\"Similar\",\"cta\":\"See more\"}},\"Residences\":{\"Hero\":{\"heading\":\"Residences\",\"paragraph\":\"Look farther with a fuller palette of possibilities. A bold architectural expression, with a facade inspired by tree canopies.\"}},\"SingleResidence\":{\"Hero\":{\"title\":\"Residence\",\"floorArea\":\"Total floor area\",\"entrance\":\"Entrance\",\"laundry\":\"Laundry room\",\"bathroom1\":\"Bathroom\",\"bathroom2\":\"Bathroom 2\",\"kitchen\":\"Kitchen\",\"livingRoom\":\"Living room\",\"livingDining\":\"Living \u0026 dining room\",\"terrace\":\"Terrace\",\"masterTerrace\":\"Terrace - Master bedroom\",\"bedroomTerrace\":\"Terrace - Bedroom\",\"bedroomsTerrace\":\"Terrace - Bedrooms\",\"gardenTerrace\":\"Terrace - Garden\",\"hallway1\":\"Hallway\",\"hallway2\":\"Hallway 2\",\"toilet\":\"Toilet\",\"bedroom1\":\"Bedroom\",\"bedroom2\":\"Bedroom 2\",\"bedroom3\":\"Bedroom 3\",\"masterBedroom\":\"Master bedroom\",\"less\":\"Less\",\"more\":\"More\",\"layout\":\"Layout\",\"floor\":\"Floor\",\"back\":\"Back\",\"request\":\"Submit a request\",\"share\":\"Share\",\"copied\":\"Copied!\",\"wing\":\"Wing\",\"balcony\":\"Balcony\",\"garden\":\"Garden\",\"residenceTypeText\":{\"one\":\"A single, light-filled space where living, kitchen, and rest flow together, opening onto a private terrace. An effortless home for one, a city base, or a dependable rental.\",\"onePLus\":\"An open living and dining area paired with a separate, flexible space that adapts to a study, nursery, or quiet retreat. Room to grow, scaled for a first home or a smart investment.\",\"two\":\"An open living, kitchen, and dining zone alongside a private bedroom, with a terrace that carries the space outdoors. A balanced, comfortable home for couples and small families.\",\"twoPlus\":\"A generous living area, a private bedroom, and an added half-room that becomes a home office, guest space, or children's room. Flexible square meters for households that need a little more.\",\"three\":\"A spacious open living and dining heart with two private bedrooms and a terrace, shaped for everyday family life with room to breathe. Daylight from more than one side wherever the layout allows.\",\"four\":\"The most spacious layout, with an expansive living zone, three private bedrooms, and a wide terrace for the whole household. The project's largest homes, made for those who want room without compromise.\"}},\"Message\":{\"tag\":\"Designed around you\",\"heading\":\"Every residence is shaped around the way you live, with open layouts, abundant daylight, and refined materials chosen to age beautifully. Wherever the architecture allows, dual orientation draws light from more than one side and opens the home to the New Belgrade skyline. Muted tones, soft curves, and room to breathe.\",\"paragraph\":\"Dual orientation fills the interior with light from multiple directions and opens up views towards the panorama of New Belgrade. Subdued tones, soft lines, and carefully crafted spaces create an atmosphere of serenity, comfort, and ease, making each home a place where daily life unfolds naturally and without compromise.\"},\"Gallery\":{\"heading\":\"Gallery\"},\"Similar\":{\"heading\":\"Similar\",\"cta\":\"See more\"}},\"Home\":{\"Introduction\":{\"Screen1\":{\"tag\":\"BELGRADE ARBOR DESIGN\",\"heading\":\"The visual identity of Belgrade Arbor is defined by an elegant facade inspired by the form of a tree canopy, a symbol of growth, balance, and longevity.\",\"cta\":\"Explore in 3d\"},\"Screen2\":{\"heading\":\"Belgrade Arbor isn't just another addition to the skyline; it's a curated urban ecosystem that evolves with the rhythm of the city.\",\"cta\":\"Explore in 3d\"},\"Screen3\":{\"heading\":\"A New Chapter in Prestigious Living\",\"paragraph\":\"A clear architectural vision, a carefully selected location, and thoughtfully curated amenities make Belgrade Arbor a residential destination where quality, comfort, and long-term value naturally converge.\",\"cta\":\"Explore Our Apartments\"}},\"Location\":{\"paragraph\":\"At one of New Belgrade's most dynamic locations, on Bulevar heroja sa Košara, Belgrade Arbor is taking shape as a contemporary residential and commercial development that seamlessly brings together refined architecture, everyday comfort, and enduring value.\",\"heading\":\"Location\"},\"Around\":{\"whatsAround\":\"What's around\",\"locations\":[{\"name\":\"Railway Station\",\"carDistance\":\"1 min\",\"walkDistance\":\"3 min\",\"description\":\"Tošin Bunar is a railway station located in the municipality of Novi Beograd. It is served by BG Voz. The railroad continues to Zemun in one direction, and New Belgrade and Old Belgrade in the other direction. Tošin Bunar railway station consists of 2 railway tracks with 2 side platforms.\",\"image\":\"/home/around/tosin.webp\"},{\"name\":\"Savremena Elementary School\",\"carDistance\":\"1 min\",\"walkDistance\":\"2 min\",\"description\":\"Savremena Elementary School is a part of an education system unique in the region, with over 20 years' experience. It was built on the foundation of Savremena International School, whose results serve as the best proof of their leadership position at all levels of education.\",\"image\":\"/home/around/savremena.webp\"},{\"name\":\"West 65\",\"carDistance\":\"1 min\",\"walkDistance\":\"3 min\",\"description\":\"West 65 is a modern residential and business complex located in New Belgrade's Block 65, known for its luxury apartments, shopping center, and a 155-meter skyscraper tower. The complex includes multiple residential buildings, pedestrian areas, restaurants, shops, and recreational facilities, all positioned in a well-connected part of the city.\",\"image\":\"/home/around/west.webp\"},{\"name\":\"Airport City\",\"carDistance\":\"2 min\",\"walkDistance\":\"4 min\",\"description\":\"Airport City Belgrade is the largest business and commercial complex in Belgrade. It consists mainly of modern office buildings that host international companies, restaurants, cafes, shops, and other business-related services. Developed as one of the first modern business parks in Serbia, Airport City has become an important corporate and economic hub in Belgrade.\",\"image\":\"/home/around/airportcity.webp\"},{\"name\":\"Hangar Food Market\",\"carDistance\":\"2 min\",\"walkDistance\":\"4 min\",\"description\":\"Hangar Food Market at Airport City Belgrade is a modern food and social hub that brings together a variety of local and international cuisines in one vibrant space. With its contemporary design and lively atmosphere, it has become a popular destination for business meetings, casual dining, and after-work gatherings.\",\"image\":\"/home/around/hangar.webp\"},{\"name\":\"Airport Nikola Tesla\",\"carDistance\":\"9 min\",\"walkDistance\":null,\"description\":\"Nikola Tesla Airport, officially Belgrade Nikola Tesla Airport, is the main international airport in Serbia. It serves as the country's busiest airport and the primary hub for Air Serbia, connecting Belgrade with destinations across Europe, Middle East, North America, and other regions. Named after the famous Serbian-American inventor Nikola Tesla, the airport has undergone major modernization and expansion in recent years to support growing passenger traffic.\",\"image\":\"/home/around/aerodrom.webp\"}]},\"Residence\":{\"heading\":\"Residences\",\"paragraph\":\"Designed with contemporary living in mind, each apartment at Belgrade Arbor balances functionality, comfort, and aesthetics. Open-plan layouts, excellent natural light, refined materials, and carefully considered details create spaces that feel both welcoming and enduring.\"},\"ResidenceOptions\":{\"residenceTypes\":[{\"name\":\"Studio\",\"unitsAvailable\":80,\"withoutLivingRoom\":false,\"images\":[\"/home/residences-options/1.webp\",\"/home/residences-options/2.webp\"]},{\"name\":\"One Bedroom\",\"unitsAvailable\":22,\"withoutLivingRoom\":true,\"images\":[\"/home/residences-options/3.webp\",\"/home/residences-options/4.webp\"]},{\"name\":\"Two Bedroom\",\"unitsAvailable\":78,\"withoutLivingRoom\":false,\"images\":[\"/home/residences-options/5.webp\",\"/home/residences-options/6.webp\",\"/home/residences-options/8.webp\"]},{\"name\":\"Three Bedroom\",\"unitsAvailable\":16,\"withoutLivingRoom\":false,\"images\":[\"/home/residences-options/9.webp\",\"/home/residences-options/10.webp\",\"/home/residences-options/7.webp\"]},{\"name\":\"Four Bedroom\",\"unitsAvailable\":12,\"withoutLivingRoom\":false,\"images\":[\"/home/residences-options/11.webp\",\"/home/residences-options/12.webp\"]}],\"viewAll\":\"View all\",\"unitsAvailable\":\"units available\",\"cta\":\"Submit a request\",\"tag\":\"Residences\"},\"BusinessSpaces\":{\"heading\":\"Office spaces and retails\",\"paragraph\":\"Business spaces and retail units at Belgrade Arbor are designed for companies of all sizes that see th
