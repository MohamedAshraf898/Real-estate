.awwwards.com/sites/belgrade-arbor\",\"target\":\"_blank\",\"rel\":\"noopener noreferrer\",\"children\":[\"$\",\"svg\",null,{\"width\":\"53.08\",\"height\":\"171.358\",\"children\":[[\"$\",\"path\",null,{\"className\":\"js-color-bg\",\"fill\":\"#e7fd55\",\"d\":\"M0 0h53.08v171.358H0z\"}],[\"$\",\"g\",null,{\"className\":\"js-color-text\",\"fill\":\"#000\",\"children\":[\"$\",\"path\",null,{\"d\":\"$14\"}]}]]}]}]}],\"$L15\",\"$L16\"]}]}]\n"])</script><script>self.__next_f.push([1,"16:[\"$\",\"div\",null,{\"id\":\"portal-root\"}]\n18:T520f,"])</script><script>self.__next_f.push([1,"## Pravila privatnosti i obaveštenje o obradi podataka o ličnosti\n\nVaša privatnost i sigurnost Vaših podataka nam je važna, stoga privredno društvo HSK DEVELOPMENT DOO (u daljem tekstu: Društvo), ispunjavajući dužnost rukovaoca prema Vama, kao ličnosti od koje se prikupljaju podaci koji se na Vas odnose, pruža Vam u trenutku prikupljanja tih podataka, a u skladu sa Zakonom o zaštiti podataka o ličnosti („Sl. glasnik RS\", br. 87/2018, u daljem tekstu: Zakon), dole navedene informacije.\n\nOva Pravila privatnosti (u daljem tekstu: Pravila) se primenjuju na fizička lica, a lični podaci su svi podaci putem kojih Vas možemo, direktno ili indirektno, identifikovati. Sve Vaše lične informacije tretiraju se kao strogo poverljive, a Društvo i/ili naši pouzdani partneri ih čuvaju na adekvatan način. Molimo Vas da pažljivo pročitate ova pravila privatnosti. Ako se ne slažete s našim postupanjem, molimo Vas da nam ne ustupate svoje lične podatke. Ukoliko nastavite da pregledate našu internet stranicu, potvrđujete da ste saglasni sa ovde navedenim Pravilima.\n\n## Podaci o rukovaocu i primaocu\n\nOdgovornost za obradu podataka o ličnosti u svojstvu rukovaoca snosi:  HSK DEVELOPMENT DOO.\n\nPrimalac podataka o ličnosti može biti privredno društvo HSK DEVELOPMENT DOO.\n\nU slučaju bilo kakvih pitanja ili zahteva u vezi postupanja ili zaštite Vaših ličnih podataka, možete nam se obratiti na e-mail adresu [info@belgradearbor.rs](mailto:info@belgradearbor.rs) ili pisanim putem na gore navedenu adresu našeg sedišta.\n\n## Predmet pravila privatnosti\n\nOva Pravila obuhvataju načine obrade Vaših ličnih podataka kada stupate u interakciju s Društvom, odnosno kada iskažete zainteresovanost za kupovinu nepokretnosti ili stupate u kontakt sa nama u vezi sa zaključenjem ugovora o kupoprodaji nepokretnosti u okviru stambeno-poslovnog kompleksa, odnosno kada:\n\n– posećujete našu internet stranicu, odnosno stranice koje služe za oglašavanje projekata Društva;\n\n– posećujete naše profile na stranicama društvenih mreža;\n\n– komunicirate sa nama telefonom ili preko kontakt forme na internet stranici ili putem email-a ili na neki drugi način;\n\n– koristite naše sisteme i aplikacije;\n\n– posećujete naše prodajne objekte;\n\n– prisustvujete na našim prezentacijama ili poslovnim događajima;\n\n– učestvujete u našim promotivnim odnosno marketing aktivnostima (npr. prijava za newsletter), anketama i slično;\n\n– sa nama zaključite ugovor u vezi sa kupoprodajom nepokretnosti ili drugi ugovor.\n\nObavezno je dostavljanje samo onih ličnih podataka koje prikupljamo za ispunjenje određenih zakonskih obaveza. Dostavljanje ličnih podataka po svim ostalim pravnim osnovima je dobrovoljno, ali napominjemo da ukoliko nam uskratite neke podatke, u određenim situacijama možda nećemo biti u mogućnosti da Vam pružimo neke usluge.\n\n## Lični podaci koje prikupljamo\n\n### 1. Podaci o ličnosti posetilaca naše internet stranice\n\nPrilikom posete naše internet stranice, odnosno internet stranica koje služe oglašavanju projekata Društva, pretraživač koji koristite na vašem uređaju će automatski i bez vaše aktivnosti poslati na server naše internet stranice: IP adresu uređaja sa kog je poslat upit i koji ima pristup internetu, datum i vreme pristupa, ime i URL preuzete datoteke, internet stranicu/aplikaciju sa koje se pristupa (referrer URL), pretraživač koji koristite i, ako je potrebno, operativni sistem računara koji podržava internet, kao i ime vašeg provajdera. Navedene podatke server privremeno čuva u takozvanoj log datoteci u sledeće svrhe:\n\n– obezbeđivanje uspostavljanja nesmetane veze;\n\n– obezbeđivanje komfornog korišćenja naše internet stranice/aplikacije, odnosno internet stranica koje služe oglašavanju projekata Društva;\n\n– procena bezbednosti i stabilnosti sistema.\n\nPodaci se čuvaju privremeno i to za vreme posete stranici, a zatim se automatski brišu. Pravni osnov za obradu IP adrese je član 12, stav 1, tačka 6) Zakona o zaštiti podataka o ličnosti (legitiman interes), koji proizilazi iz gore navedene svrhe obrade podataka.\n\n### 2. Marketing i druge aktivnosti\n\nZa potrebe slanja komercijalnih poruka, kao i za potrebe realizacije marketing aktivnosti, podaci o ličnosti prikupljaju se isključivo na osnovu saglasnosti lica (na primer u slučaju prijave za newsletter, direktan marketing i sl.), tako da se ti podaci, koje ste nam dostavili putem kontakt obrasca, putem telefona ili putem e-mail adrese, koriste u skladu sa ovde utvrđenom svrhom. Ako ste dali pristanak za prijem newsletter-a preko e-mail adrese, SMS-a, Viber-a, i/ili za prijem drugog marketing materijala koji sadrži obaveštenje o aktuelnim ponudama i promocijama u vezi sa uslugama iz naše ponude, koristimo e-mail adresu, odnosno broj telefona, ime i prezime za slanje informacija o raspoloživim nepokretnostima, promocijama, novostima i ponudama za kupoprodaju nepokretnosti. Ove podatke čuvamo i obrađujemo u svrhu slanja komercijalnih poruka, newsletter-a i/ili drugog marketing materijala, koji uključuje akcije (ponude, promocije, itd.).\n\nPravni osnov za obradu podataka prilikom slanja komercijalnih poruka, newsletter-a i/ili drugog marketing materijala je vaša saglasnost u skladu sa članom 12, stav 1, tačka 1) Zakona o zaštiti podataka o ličnosti. Vašu saglasnost za prijem newsletter-a/marketing materijala možete da opozovete u svakom trenutku. Opoziv pristanka ne utiče na dopuštenost obrade koja je vršena na osnovu pristanka pre opoziva. To možete učiniti tako što ćete se npr. na našoj internet stranici, odnosno stranici koja služi za oglašavanje projekata Društva, odjaviti sa liste za prijem newsletter-a. Link za odjavu newsletter-a možete naći na kraju svakog newsletter-a, a odjavu za Viber ili SMS možete izvršiti direktno putem Viber aplikacije ili SMS poruke, ukoliko ste dali saglasnost za ovakav vid obaveštenja. Ukoliko opozovete pristanak, obrisaćemo vaše podatke. Obaveštavamo Vas da u slučaju slanja newsletter-a/Viber/SMS poruka možemo da angažujemo eksterne partnere u cilju izvršenja ovih usluga, tako da može da dođe do prenosa Vaših podataka tim licima (podaci o e-mail adresi i broju telefona).\n\n### 3. Podaci o ličnosti kupaca nepokretnosti\n\nDruštvo obrađuje lične podatke lica koji su potrebni za pripremu, zaključenje ugovora i izvršenje ugovornih obaveza, odnosno ostvarivanje prava i obaveza iz zaključenih ugovora o kupoprodaji nepokretnosti u okviru stambeno-poslovnog kompleksa. Lični podaci koje prikupljamo od Vas su: ime i prezime, adresa (ulica, kućni broj, poštanski broj, mesto, država), JMBG, broj lične karte/pasoša, kopije ličnih dokumenata i kontakt podaci (broj telefona, e-mail adresa). Sve vaše lične podatke dobijamo direktno od Vas.\n\nPored Ugovora o kupoprodaji nepokretnosti, Društvo može sa vama zaključivati i ugovore koji se zaključuju u fazi koja prethodi procesu kupoprodaje, kao što su ugovori o rezervaciji nepokretnosti, ugovori o depozitu za kupovinu nepokretnosti i sl., i u tom slučaju prikupljamo od Vas sledeće podatke: ime i prezime, adresu (ulica, kućni broj, poštanski broj, mesto, država), kao i kontakt podatke (broj telefona, e-mail adresa). Obradu vaših podataka vršimo za svrhu pripreme Ugovora o kupoprodaji nepokretnosti, kao i pripreme, zaključenja i drugih ugovora navedenih u ovom odeljku. Pravni osnov za obradu ovih podataka je član 12, stav 1, tačka 2) i 3) Zakona, imajući u vidu izvršenje ugovornih obaveza, odnosno pravnih obaveza.\n\n### 4. Ostali podaci o ličnosti koje ste nam Vi dali\n\nObrađujemo one lične podatke koje ste nam Vi dobrovoljno dali prilikom ostvarenja inicijalnog kontakta, prilikom kasnije komunikacije (npr. kroz telefonski poziv, e-poštu, upitnike, itd.), prilikom posete internet stranici Društva ili stranica koje služe oglašavanju projekata Društva ili profilima na društvenim mrežama, kao i one lične podatke koji su proizašli iz naše komunikacije ili poslovne saradnje, a koji uključuju Vaše identifikacione podatke (ime i prezime), kao i Vaše komunikacijske podatke (kontakt telefon i e-mail adresa). Vaše podatke obrađujemo u skladu sa utvrđenom svrhom, a kako bismo na osnovu Vašeg interesovanja odgovorili na Vaš upit, bliže Vam predstavili našu ponudu i dali druge zahtevane informacije.\n\nPravni osnov za obradu podataka je član 12, stav 1, tačka 6) Zakona o zaštiti podataka o ličnosti (legitimni interes). Naš i istovremeno Vaš (legitimni) interes za ovakvu obradu podataka proizilazi iz potrebe da odgovorimo na Vaša pitanja, da rešimo postojeće probleme ukoliko je neophodno, i na taj način obezbedimo Vaše zadovoljstvo kao korisnika naših usluga, odnosno kao korisnika naše internet stranice.\n\nAko učestvujete u nekoj od naših anketa/upitnika, takvo učestvovanje je dobrovoljno. Kod anonimnih anketa ne čuvamo podatke koji omogućavaju da zaključimo ko je učesnik ankete. Čuvamo samo datum i vreme vašeg učešća. Svaki lični podatak koji ste nam dali putem ankete smatramo dobrovoljno datim i čuvamo ih u skladu sa odredbama Zakona. U slučaju da ste dali saglasnost za sprovođenje ankete, pravni osnov za obradu podataka se zasniva na Vašem pristanku u skladu sa članom 12, stav 1, tačka 1) Zakona o zaštiti podataka o ličnosti. U tom slučaju, imate pravo da opozovete Vašu saglasnost u svakom trenutku. Opoziv pristanka ne utiče na dopuštenost obrade koja je vršena na osnovu pristanka pre opoziva.\n\nDostavljanjem ličnih informacija posetilac internet stranice Društva, odnosno internet stranice koja služi oglašavanju projekata Društva, razume i slaže se sa činjenicom da bezbednost, integritet i privatnost njegovih podataka ne može biti 100% garantovana, i pored toga što Društvo konstantno preduzima sve optimalne mere radi zaštite istih.\n\n### 5. Podaci o ličnosti korisnika društvenih mreža\n\nNa stranicama društvenih mreža Društva, Društvo obrađuje podatke u svrhu informisanja lica o poslovno-stambenom kompleksu, nepokretnostima čiju prodaju nudimo, uslugama koje pružamo, promocijama, bitnim informacijama, novostima u kompaniji, a sve u svrhu interakcije sa posetiocima društvenih mreža, kao i u svrhu davanja odgovora na postavljena pitanja, pohvale i kritike, i u svrhu komuniciranja sa licima zainteresovanim za naše usluge. Obrada podataka se vrši u interesu ostvarivanja komunikacije, odnosno u cilju interakcije i unapređenja odnosa sa pratiocima. Pravni osnov za obradu Vaših podataka je član 12, stav 1, tačka 6) Zakona (legitiman interes).\n\nNa obradu podataka od strane operatera platforma društvenih mreža (npr. administracija članova i deljenje informacija) imamo samo ograničen uticaj. Tamo gde možemo da utičemo i podesimo parametre za obradu Vaših podataka, i to tako da operater platforme društvenih mreža postupa u skladu sa zaštitom podataka, mi preduzimamo sve mere koje su nam na raspolaganju. Međutim, na mnogim mestima ne možemo da utičemo na obradu podataka operatera, niti znamo koje podatke operater tačno obrađuje. Operater platforme upravlja celom IT infrastrukturom usluge, pridržava se sopstvenih pravila o zaštiti podataka i ima sa Vama poseban korisnički odnos (ukoliko ste registrovani korisnik usluge društvenih mreža). Dodatno, operater je isključivo odgovoran za sva pitanja u odnosu na podatke Vašeg korisničkog profila, kojima mi, kao kompanija, nemamo pristup. Detaljnije informacije o obradi podataka od strane operatera platforma društvenih mreža i o mogućnostima prigovora možete pronaći u njihovim pravilima o zaštiti podataka.\n\nPodatke koje ste uneli na našim stranicama društvenih mreža, kao što su npr. komentari, video snimci, slike, lajkovi, javna obaveštenja i sl., objavljuje operater platforme, a mi ih ni u jednom trenutku ne obrađujemo u neku svrhu različitu od predviđene. Zadržavamo pravo da obrišemo nezakonite ili neprimerene sadržaje, ukoliko je to potrebno. Vaše podatke obrađujemo i u svrhu komuniciranja sa Vama. Vaše sadržaje ćemo eventualno podeliti na našoj stranici ako to predstavlja funkciju platforme društvene mreže.\n\n## Pristup Vašim podacima\n\nVaše lične podatke smatramo poslovnom tajnom, te ih kao takve štitimo u skladu sa važećim zakonskim propisima i najboljom praksom. Unutar naše kompanije, pristup podacima koje ste nam stavili na raspolaganje imaju samo one organizacione jedinice, odnosno oni zaposleni kojima su isti neophodni za ispunjenje svrhe za koju su podaci o ličnosti prikupljeni. Vaše lične podatke ćemo obrađivati mi sami, dok treća lica imaju pravo pristupa i obrade Vaših ličnih podataka samo u niže opisanim situacijama:\n\n– naši pouzdani partneri, odnosno pravna lica sa kojima poslovno sarađujemo i koja nam pomažu u redovnom poslovanju. To mogu biti lica koja razvijaju i održavaju IT rešenja i platforme, servere, kao i lica koja Vam pružaju usluge u ime Društva, npr. za marketinške svrhe. U tom slučaju ta pravna lica obrađuju Vaše lične podatke isključivo za naše potrebe. Ovi pružaoci usluga su, u skladu sa zaključenim ugovorima, u obavezi da koriste podatke koji su im povereni isključivo u skladu s našim uputstvima, i strogo za svrhu koju smo opredelili, uz obavezu da adekvatno zaštite Vaše podatke i da ih drže u tajnosti;\n\n– lica s kojima poslovno sarađujemo, kada ocenimo da je to potrebno radi zaštite naših određenih i opravdanih interesa, npr. poreski savetnici, računovođe, osiguravajuće kuće, advokati i drugi savetnici. U tom slučaju, ta lica obrađuju Vaše lične podatke isključivo za naše potrebe;\n\n– nadležna tela kod sprovođenja nadzora nad zakonitošću poslovanja i postupanja, kao i druga pravna lica kad je to potrebno za izvršenje neke naše zakonske dužnosti, npr. revizor. U tom slučaju ta pravna lica obrađuju Vaše lične podatke u svrhu koja im je zakonom dodeljena;\n\n– ostale strane u vezi s poslovnim transakcijama, kao što su npr. prodaja društva ili dela društva, reorganizacija, spajanje, zajedničko ulaganje ili bilo koja druga vrsta raspolaganja našim društvom ili imovinom.\n\nTakođe, može postojati potreba da deo Vaših upita prosledimo ugovornim partnerima (npr. dobavljačima, arhitektama ili izvođačima radova kod upita u vezi specifičnih proizvoda/materijala i sl.), a u svrhu obrade Vašeg upita. Međutim, u tim slučajevima se upit prethodno anonimizira, tako da treće lice ne može da ih dovede ni u kakvu vezu sa Vama. Ukoliko u pojedinačnom slučaju prosleđivanje Vaših ličnih podataka bude neophodno, mi ćemo Vas o tome prethodno obavestiti i zatražićemo Vašu saglasnost. Treće strane su ograničene u mogućnosti korišćenja Vaših ličnih podataka u bilo koje druge svrhe, osim navedenih, te su u obavezi da štite i obrađuju Vaše lične podatke u skladu sa zakonskim, regulatornim i ugovornim obavezama. Sva pravna lica sa kojima sarađujemo su izabrana na veoma pažljiv način i, kada to nalaže zakon, ista su ugovorom obavezana na čuvanje ličnih podataka u tajnosti, a u skladu sa članom 45 Zakona o zaštiti podataka o ličnosti.\n\n## Prenos Vaših ličnih podataka u druge države\n\nU pojedinim slučajevima možemo da delimo Vaše podatke o ličnosti, odnosno da ih prenosimo u druge države u skladu sa Zakonom. Kada to činimo, prenosimo Vaše podatke na servere koji se nalaze u EU ili u zemlji koja obezbeđuje adekvatan nivo zaštite u skladu sa zakonodavstvom Republike Srbije. Pristup će biti dozvoljen samo ograničenom broju lica, odnosno ovlašćenim osobama, isključivo za održavanje funkcionalnosti servera.\n\n## Način na koji štitimo Vaše lične podatke\n\nNeke od mera zaštite koje sprovodimo su sledeće:\n\n– primena savremenih metoda zaštite i kontrole pristupa izvorima podataka koji sadrže lične podatke;\n\n– ograničenje pristupa osetljivim podacima, kao i ograničenje korisničkih naloga koji mogu imati pristup određenim podacima, uvodeći sistem rola i autorizacija koje će da obezbede da samo određeni zaposleni rukovaoci kojima je neophodan pristup podacima za obavljanje radnih zadataka mogu da imaju uvid i vrše obradu odgovarajućih podataka;\n\n– kontinuirani nadzor nad svim resursima (fizičkim prostorima gde se Vaši podaci čuvaju) koji se koriste za obradu ličnih podataka.\n\nSvrha sprovođenja navedenih mera je sprečavanje rizika od uništenja, gubitka, izmene, neovlašćenog otkrivanja ili pristupa Vašim ličnim podacima. Korišćenje odgovarajućih mera zaštite, u odnosu na Vaše lične podatke, tražimo i od trećih osoba koje imaju pravo pristupa i obrade Vaših ličnih podataka. Svi podaci o ličnosti se čuvaju na našem serveru u Republici Srbiji. Napominjemo da se gore navedene mere zaštite ne odnose na informacije, odnosno podatke koje izaberete da delite u javnosti preko društvenih mreža ili aplikacija za razmenu poruka.\n\n## Period čuvanja Vaših ličnih podataka\n\nPodaci o ličnosti se čuvaju onoliko vremena koliko je potrebno za obezbeđivanje svrhe za koju su podaci o ličnosti prikupljeni. Ukoliko ste sa nama zaključili ugovor, podatke čuvamo dok traju prava i obaveze iz ugovora, a nakon toga onoliko dugo koliko to zahtevaju primenjivi propisi. Vaše podatke o ličnosti zadržavamo i nakon raskida ugovornog odnosa ako su nam Vaši podaci potrebni za utvrđivanje, ostvarivanje ili odbranu pravnih zahteva ili usaglašavanje sa merodavnim zakonima. U meri u kojoj je to moguće, ograničićemo obradu vaših podataka o ličnosti u te ograničene svrhe nakon prestanka ugovornog odnosa. Nakon ispunjenja svrhe, odnosno nakon isteka zakonom propisanog roka za čuvanje podataka o ličnosti, podaci o ličnosti će biti trajno obrisani.\n\n## Vaša prava\n\nAko odlučite da se koristite jednim ili više od svojih niže navedenih prava, imamo pravo proveriti Vaš identitet, sve u svrhu zaštite ličnih podataka. Vaša prava ostvarujete besplatno. Izuzetno, ako je Vaš zahtev očigledno neosnovan ili preteran (npr. tražite lične podatke koje i sami posedujete), a posebno ako se isti zahtev učestalo ponavlja, imamo pravo da naplatimo nužne troškove postupanja po Vašem zahtevu ili da odbijemo da postupimo po Vašem zahtevu. Molimo Vas da sva pitanja i zahteve vezane za Vaša prava u pisanom obliku šaljete na adresu navedenu u odeljku Podaci o rukovaocu. Na Vaš zahtev ćemo odgovoriti odmah, a najkasnije u roku od mesec dana, osim ako izuzetna složenost pojedinačnog slučaja zahteva produženje navedenog roka. Da bismo Vas zaštitili kao titulara ličnih podataka, potrebno je da se na odgovarajući način identifikujete kao podnosilac prijave, što će za Društvo predstavljati jemstvo da lične podatke daje njihovom vlasniku.\n\n**Pristup Vašim ličnim podacima**\n\nImate pravo da od nas tražite informaciju o tome da li obrađujemo Vaše podatke o ličnosti, pristup tim podacima, kao i informacije o obradi u skladu sa članom 26. Zakona.\n\n**Ispravka netačnih, dopuna, brisanje i ograničenje upotrebe ličnih podataka**\n\nImate pravo da tražite ispravku Vaših netačnih ličnih podataka, kao i pravo da dopunite, brišete i ograničite upotrebu Vaših ličnih podataka.\n\n**Prenosivost ličnih podataka**\n\nImate pravo da preuzmete i tražite prenos Vaših ličnih podataka.\n\n**Pravo na povlačenje saglasnosti i zaborav**\n\nImate pravo da povučete Vašu saglasnost za obradu ličnih podataka, kao i da tražite da se trajno brišu Vaši lični podaci koje smo obrađivali na osnovu Vaše saglasnosti.\n\n**Prigovor protiv obrade ili postupanja s Vašim ličnim podacima**\n\nImate pravo prigovora na obradu Vaših ličnih podataka, kao i uopšteno na naš način postupanja s Vašim ličnim podacima. Vaš zahtev nam pošaljite putem e-pošte na adresu navedenu u odeljku Podaci o rukovaocu, gde u naslovu poruke navodite „Prigovor protiv obrade\", a u samoj poruci objašnjavate razlog prigovora i Vaš zahtev.\n\n**Pravo na pritužbu Povereniku za informacije od javnog značaja i zaštitu podataka o ličnosti**\n\nU svakom trenutku imate pravo na pritužbu pred nadležnim organom za zaštitu ličnih podataka – Poverenikom za informacije od javnog značaja i zaštitu podataka o ličnosti ([https://www.poverenik.rs/](https://www.poverenik.rs/)).\n\n## Izmene politike privatnosti\n\nDruštvo zadržava pravo da bilo kada izmeni ova pravila privatnosti. Svaka izmena postaje važeća nakon njenog objavljivanja na internet stranici Društva ili na drugi adekvatan način. S tim u vezi, preporučujemo Vam da redovno vršite proveru odeljka koji se odnosi na Politiku privatnosti kako biste imali najnovije informacije.\n\nBeograd, 02.11.2025.\n\n*Napomena: Nakon završetka materijalizacije projekta može doći do manjih odstupanja u izgledu fasade ili detalja u odnosu na prikazane rendere. Numeracija prostorija izvedena je u skladu sa načinom evidentiranja nekretnina u katastru Republike Srbije.*"])</script><script>self.__next_f.push([1,"11:[\"$\",\"$L17\",null,{\"formats\":\"$undefined\",\"locale\":\"sr\",\"messages\":{\"Contact\":{\"title\":\"Pošaljite\",\"request\":\"upit\",\"description\":\"Za više informacija o raspoloživim nekretninama u Belgrade Arbor-u, molimo Vas da popunite formular i uskoro ćemo Vas kontaktirati.\",\"tabs\":{\"request\":\"Pošaljite zahtev\",\"callback\":\"Zatražite poziv\",\"business\":\"Pravna lica\"},\"formFields\":{\"firstName\":{\"label\":\"Ime\",\"error\":\"Ime je obavezno\"},\"lastName\":{\"label\":\"Prezime\",\"error\":\"Prezime je obavezno\"},\"fullName\":{\"label\":\"Ime i prezime\",\"error\":\"Ime i prezime je obavezno\"},\"companyName\":{\"label\":\"Naziv firme\",\"error\":\"Naziv firme je obavezan\"},\"email\":{\"label\":\"E-mail\",\"errorInvalid\":\"Neispravna email adresa\",\"error\":\"E-mail je obavezan\"},\"phone\":{\"label\":\"Kontakt telefon\",\"error\":\ ero\":{\"heading\":\"O INVESTITORU\",\"tag\":\"Perose Property Group\",\"paragraph\":\"Perose Property Group je holding kompanija, specijalizovana za razvoj, investicije i upravljanje stambenim i poslovnim projektima širom Srbije. Naš portfolio obuhvata projekte kao što su: AD Residence u Zemunu, Harmony Homes, Stari Mlin i Old City Residence u Kragujevcu.\",\"cta\":\"Kontaktirajte nas\"},\"Static1\":{\"heading\":\"Svaki naš projekat odlikuju savremena arhitektura, visoki standardi gradnje i pažljivo odabrane lokacije koje pružaju dugoročnu vrednost vlasnicima stanova i poslovnih prostora.\",\"paragraph\":\"Naša misija je stvaranje trajne vrednosti kroz inovativan i održiv razvoj koji unapređuje urbane sredine i poboljšava kvalitet života.\"},\"Projects\":{\"projects\":[{\"name\":\"Belgrade Arbor\",\"location\":\"BEOGRAD\",\"image\":\"/about-the-investor/slide1.webp\",\"descriptions\":[\"Belgrade Arbor jedan je od naših najvećih  projekata i predstavlja viziju kojom se vodimo, a to je da svaki kvadratni metar treba da ima svoju svrhu i doprinese funkcionalnosti, kvalitetu i vrednosti prostora. Kroz dosledan pristup dizajnu, pažljiv odabir partnera i posvećenost svakom detalju, stvaramo moderan kompleks mešovite namene, koji odgovara savremenim potrebama života i poslovanja, istovremeno doprinoseći razvoju urbanog identiteta Beograda.\"]},{\"name\":\"AD Residence\",\"location\":\"BEOGRAD\",\"image\":\"/about-the-investor/slide6.webp\",\"descriptions\":[\"AD Residence je savremeni stambeno-poslovni kompleks, smešten u mirnom delu Zemuna, osmišljen tako da spoja kvalitetnu gradnju, funkcionalan dizajn i udobnost svakodnevnog života. Projekat obuhvata dve lamele sa raznovrsnom ponudom stambenih jedinica i poslovnih prostora, uz prostranu podzemnu garažu na tri nivoa. Zahvaljujući pažljivo odabranoj lokaciji, blizini Dunava i odličnoj povezanosti sa ostatkom grada, AD Residence predstavlja idealan izbor za sve koji žele moderan dom u mirnom okruženju, bez odricanja od svih prednosti urbanog života.\"]},{\"name\":\"Harmony Homes\",\"location\":\"Kragujevac\",\"image\":\"/about-the-investor/slide2.webp\",\"descriptions\":[\"Harmony Homes je moderan stambeni kompleks u Kragujevcu, smešten između ulica Gavrila Principa i Daničićeve. Projekat obuhvata dve zgrade sa ukupno 86 stanova, poslovnim prostorom i pažljivo uređenim zelenim površinama namenjenim prijatnom porodičnom životu.\",\"Kako bi svakodnevica stanara i posetilaca bila što jednostavnija, kompleks nudi prostrane parking kapacitete, uključujući sigurnu podzemnu garažu i dostupna parking mesta. Savremena arhitektura i funkcionalni rasporedi stanova stvaraju ravnotežu između urbanog načina života i udobnosti modernog doma.\"]},{\"name\":\"Stari Mlin\",\"location\":\"Kragujevac\",\"image\":\"/about-the-investor/slide4.webp\",\"descriptions\":[\"Projekat Stari Mlin, koji razvija Perose Real Estate na adresi Dr Jovana Ristića 170 u Kragujevcu, predstavlja savremeni stambeno-poslovni  kompleks, izgrađen na mestu nekadašnjeg gradskog mlina, čuvajući duh istorijske lokacije kroz spoj tradicije i moderne arhitekture.\",\"Projekat trenutno obuhvata dve zgrade u izgradnji, sa ukupno 34 stana, dva poslovna prostora i 42 parking mesta. Planirana treća zgrada, koja je trenutno u fazi projektovanja, dodatno će obogatiti kompleks podzemnom garažom i još 12 stambenih jedinica. Završetak projekta planiran je krajem 2027. godine, a Stari Mlin će spojiti lokalno nasleđe i savremeni dizajn, pružajući kvalitetan urbani život i pažljivo osmišljene prostore za budućnost.\"]},{\"name\":\"Old City Residence\",\"location\":\"Kragujevac\",\"image\":\"/about-the-investor/slide3.webp\",\"descriptions\":[\"Old City Residence je značajan projekat, planiran na atraktivnoj lokaciji u Kragujevcu. Početak izgradnje planiran je krajem 2026. godine, a projekat objedinjuje savremenu arhitekturu i promišljen koncept prostora, stvarajući dinamično okruženje prilagođeno modernom načinu života i poslovanja.\",\"Kompleks će obuhvatiti 169 stambenih jedinica, više poslovnih prostora i 222 garažna mesta raspoređena na dve podzemne etaže, pružajući visok nivo komfora i praktičnosti budućim stanarima i korisnicima prostora.\"]},{\"name\":\"Centar Crvenog krsta\",\"location\":\"Kragujevac\",\"image\":\"/about-the-investor/slide5.webp\",\"descriptions\":[\"Novi Centar Crvenog krsta u Kragujevcu, razvijen u saradnji sa Gradskom organizacijom Crvenog krsta, predstavlja savremeno i funkcionalno rešenje koje zamenjuje postojeće neadekvatne kapacitete. Smešten na uglu ulica Vojvode Putnika 4 i Luja Pastera, objekat površine 1.198 m² biće u potpunosti prilagođen potrebama korisnika, kroz rekonstrukciju i proširenje postojećeg prostora.\",\"Novi centar će obuhvatiti moderne kancelarije, javnu kuhinju, prostorije namenjene humanitarnim programima, kao i posebno opremljene zone za obuku volontera, čime će dodatno unaprediti kapacitete organizacije i njenu podršku lokalnoj zajednici.\"]}]},\"Static2\":{\"heading\":\"Perose Property Group - Verujemo da kvalitetni projekti nastaju kroz posvećenost kvalitetu, odgovoran pristup i dugoročno promišljanje.\",\"description\":\"Kroz svaki stambeni i/ili poslovni i projekat koji gradimo, cilj je da stvaramo prostore koji donose dugoročnu vrednost, unapređuju urbano okruženje i doprinose kvalitetnijem svakodnevnom životu ljudi koji ih koriste.\",\"description2\":\"Kako nastavljamo da rastemo, ostajemo posvećeni principima koji definišu naš rad - pažljivom planiranju, visokim standardima gradnje, održivom razvoju i posvećenosti svakom detalju. U budućnosti ćemo nastaviti da ulažemo u inovativne projekte koji doprinose razvoju gradova u Srbiji i stvaraju zajednice prilagođene generacijama koje dolaze.\"}},\"RetailSpaces\":{\"Hero\":{\"heading\":\"LOKALI\",\"paragraph\":\"Prestižna adresa na kojoj poslovanje dobija novu dimenziju. Lokali i ugostiteljski sadržaji u prizemlju, uz fleksibilne poslovne prostore na višim etažama, pažljivo su osmišljeni kako bi odgovorili na potrebe savremenog poslovanja. Prepoznatljiva arhitektura, obilje prirodne svetlosti i odlična povezanost sa srcem Novog Beograda stvaraju okruženje koje podstiče rast, saradnju i poslovni uspeh.\"}},\"FiltersResidence\":{\"filters\":\"Filteri\",\"all\":\"Sve\",\"features\":\"Dodatno\",\"garden\":\"Bašta\",\"balcony\":\"Balkon\",\"wing\":\"Lamela\",\"floor\":\"SPRAT\",\"resetFilters\":\"Resetuj filtere\",\"results\":\"Rezultati\",\"seeMore\":\"Učitaj više\",\"noResults\":\"Nema rezultata za izabrane filtere.\"},\"FiltersRetail\":{\"heading\":\"Filteri\",\"floor\":\"SPRAT\",\"all\":\"Svi\",\"offices\":\"Kancelarije\",\"retail\":\"Lokali\",\"wing\":\"Lamela\",\"resetFilters\":\"Resetuj filtere\",\"results\":\"Rezultati\",\"seeMore\":\"Učitaj više\",\"noResults\":\"Nema rezultata za izabrane filtere.\"},\"ResidenceCard\":{\"rooms\":\"broj soba\",\"floor\":\"sprat\",\"basement\":\"Podrum\",\"groundFloor\":\"Prizemlje\",\"seeMore\":\"Vidi više\"},\"RetailCard\":{\"basement\":\"Podrum\",\"groundFloor\":\"Prizemlje\",\"floor\":\"sprat\"},\"Business\":{\"Hero\":{\"heading\":\"POSLOVNI PROSTORI\",\"subheading\":\"Zakoračite ka novim poslovnim uspesima na adresi Belgrade Arbor!\",\"paragraph\":\"U savremenom poslovnom svetu, poslovni prostor predstavlja mnogo više od mesta za rad. Poslovni prostor odražava identitet kompanije, podstiče inovacije i stvara uslove za dugoročan rast. Zato, uspešne kompanije biraju lokacije koje spajaju prestižnu adresu, vrhunsku funkcionalnost, fleksibilne poslovne prostore i odličnu povezanost sa najvažnijim poslovnim centrima. Belgrade Arbor pruža upravo takvo okruženje - savremeni poslovni ambijent osmišljen da podrži razvoj Vašeg poslovanja, unapredi svakodnevni rad i ostavi snažan utisak na zaposlene, klijente i poslovne partnere. Vaš naredni poslovni uspeh počinje upravo ovde.\",\"cta\":\"Pogledajte promo video\"},\"Introduction\":{\"Screen1\":{\"tag\":\"Izuzetna povezanost sa svim delovima grada\",\"heading\":\"Poslovni prostori u okviru Belgrade Arbor pažljivo su osmišljeni za kompanije koje traže ekskluzivnu lokaciju, vrhunsku funkcionalnost i dugoročnu vrednost.\"},\"Screen2\":{\"paragraph1\":\"Smešten u srcu poslovne zone na Novom Beogradu, Belgrade Arbor nalazi se u neposrednoj blizini ključnih poslovnih centara - Airport City kompleksa* i Hangara*. Odlična povezanost sa železničkom stanicom Tošin bunar, kao i brz pristup Aerodromu „Nikola Tesla“, čine ovu lokaciju idealnim izborom za kompanije.\",\"paragraph2\":\"Dodatnu vrednost lokaciji daje i blizina Osnovne škole „Savremena“, koja pruža moderno, podsticajno i inovativno okruženje za obrazovanje Vaših najmlađih.\",\"note1\":\"*Airport City Belgrade je najprestižniji poslovni kompleks mešovite namene i najveći poslovni park u Srbiji.\",\"note2\":\"*Hangar je savremena urbana destinacija koja objedinjuje restorane, prostore za događaje i sadržaje namenjene kreativnim industrijama.\"},\"Screen3\":{\"heading\":\"Savremena arhitektura i sofisticirani enterijer\",\"paragraph\":\"Pažljivo osmišljeni kancelarijski prostori, atraktivna lokacija na Novom Beogradu i sadržaji koji olakšavaju svakodnevno poslovanje čine Belgrade Arbor idealnim mestom za razvoj Vašeg biznisa. Izaberite poslovno okruženje u kojem se funkcionalnost, profesionalni imidž i kvalitet radnog iskustva prirodno dopunjuju.\",\"cta\":\"Istraži prostore\"}},\"BusinessSpacesOptions\":{\"businessSpaces\":[{\"name\":\"Lamela A\",\"unitsAvailable\":11,\"description\":\"Prilagodljiv raznim tipovima biznisa, sa optimalnim rasporedom i prirodnim osvetljenjem koje podstiče produktivnu radnu atmosferu.\"},{\"name\":\"Lamela B\",\"unitsAvailable\":11,\"description\":\"Komforno i funkcionalno, pogodno za kancelarije, kоuorking ili šou-rumove, uz lak pristup i profesionalno okruženje.\"},{\"name\":\"Lamela V\",\"unitsAvailable\":9,\"description\":\"Nalazi se duž reprezentativnog, impresivnog ulaza sa staklenom fasadom. Ova poslovna lamela nema stambenih jedinica, što poslovnim zakupcima omogućava dodatni nivo privatnosti i profesionalnog ambijenta.\"},{\"name\":\"Lokali\",\"unitsAvailable\":18,\"description\":\"Kompleks Belgrade Arbor raspolaže sa 18 lokala i ugostiteljskih prostora ravnomerno raspoređenih kroz A i B vertikalu. Svi prostori se nalaze u prizemlju, na uličnoj fasadi zgrade, što omogućava maksimalnu vidljivost i direktan pristup sa ulice.\"}],\"office\":\"poslovnih\",\"spaces\":\"prostora\",\"brochure\":\"BROŠURA\",\"inquire\":\"Pošalji upit\",\"mobileTag\":\"Poslovni prostori\"},\"Panorama\":{\"heading\":\"Trenuci uživanja i gastronomski doživljaji sa panoramskim pogledom\",\"paragraph1\":\"Belgrade Arbor pruža pažljivo osmišljene sadržaje u okviru kompleksa, uključujući kafe-restoran na najvišoj povučenoj etaži, kao i odličnu povezanost sa brojnim poslovnim i komercijalnim sadržajima u neposrednoj blizini.\",\"paragraph2\":\"Sve to doprinosi stvaranju zaokruženog poslovnog okruženja u kojem se svakodnevni rad, sastanci i poslovne aktivnosti odvijaju jednostavno i efikasno, na jednoj adresi.\",\"paragraph3\":\"Autentičnost prostora dodatno naglašava otvoren panoramski pogled na Novi Beograd, stvarajući idealan ambijent za neformalne sastanke, povezivanje i razgovore u prijatnom i inspirativnom okruženju.\",\"cta\":\"Istraži prostore\"}},\"SingleBusinessSpace\":{\"Hero\":{\"office\":\"Kancelarija\",\"retail\":\"Lokal\",\"size\":\"Površina\",\"floor\":\"Sprat\",\"type\":\"Tip\",\"description\":\"Pametno dizajnirani poslovni prostori sa maksimalnom vidljivošću i odličnom povezanosti. Fleksibilni rasporedi prilagođavaju potrebama Vaše kompanije, bez obzira da li se radi o rastu kompanije ili otvaranju nove lokacije.\",\"wing\":\"Lamela\",\"submitRequest\":\"Pošaljite zahtev\",\"share\":\"Podeli\",\"copied\":\"Kopirano!\",\"windowPrompt\":\"Kopirajte ovaj link:\",\"back\":\"Nazad\",\"layout\":\"Raspored\",\"floorPlan\":\"sprat\",\"basement\":\"Podrum\",\"groundFloor\":\"Prizemlje\",\"officeDescription\":\"Poslovni prostori kreirani za različite poslovne ideje i potrebe, sa odličnom pozicijom, velikom vidljivošću i savremenim dizajnom koji ostavlja snažan utisak. Fleksibilan raspored omogućava da prostor oblikujete prema svom načinu poslovanja - bilo da razvijate postojeći biznis, širite tim ili pokrećete novu poslovnu priču.\",\"retailDescription\":\"Lokali kreirani za različite poslovne ideje i potrebe, sa odličnom pozicijom, velikom vidljivošću i savremenim dizajnom koji ostavlja snažan utisak. Fleksibilan raspored omogućava da prostor oblikujete prema svom načinu poslovanja - bilo da razvijate postojeći biznis, širite tim ili pokrećete novu poslovnu priču.\"},\"Message\":{\"tag\":\"Vizija\",\"heading\":\"U Belgrade Arboru, Vaše poslovanje dobija mesto na jednoj od najprestižnijih adresa Novog Beograda. Maloprodajni i kancelarijski prostori pažljivo su projektovani kako bi odgovorili na različite poslovne potrebe, spajajući funkcionalnost, savremenu arhitekturu i obilje prirodne svetlosti.\",\"paragraph\":\"Fleksibilni rasporedi omogućavaju da prostor prilagodite načinu na koji poslujete, stvarajući reprezentativno i inspirativno okruženje za rad, susrete i razvoj Vašeg poslovanja.\"},\"Gallery\":{\"heading\":\"Galerija\"},\"Similar\":{\"heading\":\"Slični\",\"cta\":\"Pogledaj više\"}},\"Residences\":{\"Hero\":{\"heading\":\"Stanovi\",\"paragraph\":\"Budućnost koja donosi nove perspektive i neograničene mogućnosti. Prepoznatljiva arhitektura, upotpunjena fasadom inspirisanom raskošnim krošnjama drveća, stvarajući tako jedinstvenu harmoniju između modernog dizajna i prirodnog okruženja.\"}},\"SingleResidence\":{\"Hero\":{\"title\":\"Stanovi\",\"floorArea\":\"Ukupna kvadratura\",\"entrance\":\"Ulaz\",\"laundry\":\"Ostava za veš\",\"bathroom1\":\"Kupatilo\",\"bathroom2\":\"Kupatilo 2\",\"kitchen\":\"Kuhinja\",\"livingRoom\":\"Dnevna soba\",\"livingDining\":\"Dnevni boravak i trpezarija\",\"terrace\":\"Terasa\",\"masterTerrace\":\"Terasa - Glavna spavaća soba\",\"bedroomTerrace\":\"Terasa - Spavaća soba\",\"bedroomsTerrace\":\"Terasa - Spavaće sobe\",\"gardenTerrace\":\"Terasa - Bašta\",\"hallway1\":\"Hodnik\",\"hallway2\":\"Hodnik 2\",\"toilet\":\"Toalet\",\"bedroom1\":\"Spavaća soba\",\"bedroom2\":\"Spavaća soba 2\",\"bedroom3\":\"Spavaća soba 3\",\"masterBedroom\":\"Glavna spavaća soba\",\"less\":\"Manje\",\"more\":\"Više\",\"layout\":\"Raspored\",\"floor\":\"Sprat\",\"back\":\"Nazad\",\"request\":\"Pošalji upit\",\"share\":\"Podeli\",\"copied\":\"Kopirano!\",\"wing\":\"Lamela\",\"balcony\":\"Balkon\",\"garden\":\"Bašta\",\"residenceTypeText\":{\"one\":\"Pažljivo osmišljen i svetlom ispunjen prostor u kojem se dnevni boravak, kuhinja i spavaća soba skladno nadovezuju jedan na drugi, stvarajući funkcionalnu celinu povezanu sa terasom. Idealan izbor za udoban život ili sigurnu investiciju za izdavanje.\",\"onePLus\":\"Otvoren dnevni i trpezarijski prostor uparen sa odvojenim, fleksibilnim kutkom koji može postati radna soba, dečja soba ili mirno sklonište. Prostor za rast, savršen za prvi dom ili pametnu investiciju.\",\"two\":\"Otvoren koncept koji objedinjuje dnevni boravak, kuhinju i trpezariju, uz odvojenu spavaću sobu i terasu koja dodatno proširuje životni prostor. Idealan izbor za parove i manje porodice koje traže funkcionalan, udoban i savremeno organizovan dom.\",\"twoPlus\":\"Prostrani dnevni boravak, privatna spavaća soba i dodatna polusoba koja može biti radna soba, gostinjska soba ili dečja soba. Fleksibilni kvadrati za domaćinstva kojima treba malo više prostora.\",\"three\":\"Dom sa prostranim dnevnim boravkom i trpezarijom, dve spavaće sobe i terasom koja upotpunjuje svakodnevni život. Funkcionalan raspored i prirodna svetlost sa više strana stvaraju prijatan ambijent za porodicu, odmor i zajedničke trenutke.\",\"four\":\"Jedan od najvećih stanova u okviru projekta koji pruža obilje prostora za udoban porodični život. Prostran dnevni boravak, tri spavaće sobe i velika terasa, što ga čine ih idealnim izborom za one koji žele više prostora, više komfora i dom koji se prilagođava svim potrebama. \"}},\"Message\":{\"tag\":\"Po Vašoj meri\",\"heading\":\"Svaki stan u Belgrade Arboru oblikovan je prema Vašem načinu života, sa pažljivo osmišljenim rasporedom koji pruža maksimalnu funkcionalnost, obilje prirodne svetlosti i prefinjene materijale, odabrane tako da zadrže svoju lepotu i kvalitet kroz vreme.\",\"paragraph\":\"Dvostrana orijentacija ispunjava enterijer svetlošću iz više pravaca i otvara pogled ka panorami Novog Beograda. Prigušeni tonovi, nežne linije i pažljivo kreirani prostori stvaraju atmosferu mira, udobnosti i lakoće, čineći svaki dom mestom u kojem se svakodnevni život odvija prirodno i bez kompromisa.\"},\"Gallery\":{\"heading\":\"Galerija\"},\"Similar\":{\"heading\":\"Slični\",\"cta\":\"Pogledaj više\"}},\"Home\":{\"Introduction\":{\"Screen1\":{\"tag\":\"BELGRADE ARBOR DIZAJN\",\"heading\":\"Vizuelni identitet Belgrade Arbora oblikovan je prepoznatljivom, elegantnom fasadom koja podseća na krošnju drveta - simbol rasta, harmonije i dugovečnosti.\",\"cta\":\"Pogledaj u 3D\"},\"Screen2\":{\"heading\":\"Belgrade Arbor nije samo još jedno obeležje gradskog horizonta, već pažljivo kreiran urbani ekosistem koji živi i razvija se u ritmu grada.\",\"cta\":\"Pogledaj u 3D\"},\"Screen3\":{\"heading\":\"Novo poglavlje prestižnog stanovanja.\",\"paragraph\":\"Jasna arhitektonska vizija, pažljivo odabrana lokacija i brižljivo osmišljeni sadržaji čine Belgrade Arbor stambenom adresom u kojoj se kvalitet, komfor i dugoročna vrednost prirodno susreću.\",\"cta\":\"Istražite ponudu stanova\"}},\"Location\":{\"paragraph\":\"Na jednoj od najatraktivnijih lokacija Novog Beograda, u Bulevaru heroja sa Košara, nastaje Belgrade Arbor, savremeni stambeno-poslovni kompleks koji povezuje kvalitetnu arhitekturu, udobnost svakodnevnog života i dugoročnu vrednost.\",\"heading\":\"Lokacija\"},\"Around\":{\"whatsAround\":\"U okolini\",\"locations\":[{\"name\":\"Železnička stanica\",\"carDistance\":\"1 min\",\"walkDistance\":\"3 min\",\"description\":\"Železnička stanica Tošin bunar nalazi se na teritoriji opštine Novi Beograd i deo je sistema BG Voz. Povezuje Zemun sa jedne strane, odnosno Novi Beograd i centar grada sa druge. Stanica raspolaže sa dva koloseka i dva perona.\",\"image\":\"/home/around/tosin.webp\"},{\"name\":\"Savremena osnovna škola\",\"carDistance\":\"1 min\",\"walkDistance\":\"2 min\",\"description\":\"Savremena osnovna škola je deo jedinstvenog obrazovnog sistema sa više od dve decenije iskustva. Nastala je na temeljima Savremena International School, prepoznate po visokim obrazovnim standardima i rezultatima koji je svrstavaju među vodeće obrazovne ustanove u regionu.\",\"image\":\"/home/around/savremena.webp\"},{\"name\":\"West 65\",\"carDistance\":\"1 min\",\"walkDistance\":\"3 min\",\"description\":\"West 65 je savremen stambeno-poslovni kompleks smešten u Bloku 65 na Novom Beogradu. Poznat je po luksuznim stambenim jedinicama, tržnom centru i impozantnoj kuli, visokoj 155 metara. Kompleks obuhvata brojne sadržaje, uključujući restorane, prodavnice, uređene pešačke zone i prostore za rekreaciju.\",\"image\":\"/home/around/west.webp\"},{\"name\":\"Airport City\",\"carDistance\":\"2 min\",\"walkDistance\":\"4 min\",\"description\":\"Airport City Belgrade predstavlja najveći poslovno-komercijalni kompleks u Beogradu. Sastoji se od modernih poslovnih zgrada u kojima posluju brojne međunarodne kompanije, uz bogatu ponudu restorana, kafića, prodavnica i drugih sadržaja. Danas važi za jedno od najznačajnijih poslovnih središta u Srbiji.\",\"image\":\"/home/around/airportcity.webp\"},{\"name\":\"Hangar Food Market\",\"carDistance\":\"2 min\",\"walkDistance\":\"4 min\",\"description\":\"Hangar Food Market u Airport City-ju savremeni je gastronomski koncept koji objedinjuje bogatu ponudu domaćih i svetskih kuhinja u živopisnom i moderno osmišljenom prostoru. Zahvaljujući prijatnoj atmosferi i pažljivo kreiranom ambijentu, predstavlja popularno mesto za poslovne susrete, opuštene obroke i druženja nakon posla.\",\"image\":\"/home/around/hangar.webp\"},{\"name\":\"Aerodrom Nikola Tesla\",\"carDistance\":\"9 min\",\"walkDistance\":null,\"description\":\"Aerodrom Nikola Tesla glavni je međunarodni aerodrom u Srbiji i najvažnije vazdušno čvorište u zemlji. Kao matična baza kompanije Air Serbia, povezuje Beograd sa brojnim destinacijama širom Evrope, Bliskog istoka i Severne Amerike. Zahvaljujući značajnim ulaganjima u modernizaciju, danas putnicima pruža još viši nivo usluge i povezanosti sa brojnim svetskim destinacijama.\",\"image\":\"/home/around/aerodrom.webp\"}]},\"Residence\":{\"heading\":\"Stanovi\",\"paragraph\":\"Svaki stan u Belgrade Arboru osmišljen je u skladu sa potrebama savremenog života, spajajući funkcionalnost, udobnost i estetiku. Funkcionalni rasporedi, obilje prirodne svetlosti, pažljivo odabrani materijali i promišljeni detalji stvaraju prostor koji je podjednako udoban i prijatan za život, danas i u godinama koje dolaze.\"},\"ResidenceOptions\":{\"residenceTypes\":[{\"name\":\"Studio\",\"unitsAvailable\":80,\"withoutLivingRoom\":false,\"images\":[\"/home/residences-options/1.webp\",\"/home/residences-options/2.webp\"]},{\"name\":\"Jednosobni\",\"unitsAvailable\":22,\"withoutLivingRoom\":true,\"images\":[\"/home/residences-options/3.webp\",\"/home/residences-options/4.webp\"]},{\"name\":\"Dvosobni\",\"unitsAvailable\":78,\"withoutLivingRoom\":false,\"images\":[\"/home/residences-options/5.webp\",\"/home/residences-options/6.webp\",\"/home/residences-options/8.webp\"]},{\"name\":\"Trosobni\",\"unitsAvailable\":16,\"withoutLivingRoom\":false,\"images\":[\"/home/residences-options/9.webp\",\"/home/residences-options/10.webp\",\"/home/residences-options/7.webp\"]},{\"name\":\"Četvorosobni\",\"unitsAvailable\":12,\"withoutLivingRoom\":false,\"images\":[\"/home/residences-options/11.webp\",\"/home/residences-options/12.webp\"]}],\"viewAll\":\"Pogledaj sve\",\"unitsAvailable\":\"Dostupnih jedinica\",\"cta\":\"Pošaljite om Beogradu. Pošaljite upit ili zatražite povratni poziv - uskoro ćemo Vas kontaktirati.\"},\"business\":{\"title\":\"Poslovni prostori\",\"description\":\"Kancelarijski i poslovni prostori u Belgrade Arbor na Novom Beogradu. Prestižna adresa, fleksibilni rasporedi i odlična povezanost za Vašu kompaniju.\"},\"aboutInvestor\":{\"title\":\"O investitoru\",\"description\":\"Saznajte više o Perose Property Group - investitoru iza Belgrade Arbor i stambeno-poslovnih projekata širom Srbije.\"},\"threeD\":{\"title\":\"3D iskustvo\",\"description\":\"Istražite Belgrade Arbor u 3D prikazu. Pregledajte kompleks, filtrirajte stanove i poslovne jedinice i pronađite prostor koji Vam odgovara.\"},\"residences\":{\"title\":\"Stanovi\",\"description\":\"Pregledajte stanove u Belgrade Arbor na Novom Beogradu - od garsonjera do trosobnih domova sa savremenom arhitekturom, prirodnim svetlom i premium sadržajima.\"},\"retailSpaces\":{\"title\":\"Poslovni prostori i lokali\",\"description\":\"Istražite poslovne prostore i lokale u Belgrade Arbor. Maksimalna vidljivost, direktan pristup ulici i fleksibilni rasporedi u srcu Novog Beograda.\"},\"privacyPolicy\":{\"title\":\"Politika privatnosti\",\"description\":\"Politika privatnosti i obaveštenje o obradi ličnih podataka Belgrade Arbor - kako prikupljamo, koristimo, štitimo i čuvamo Vaše podatke.\"},\"residenceDetail\":{\"title\":\"Stan {name}\",\"description\":\"Stan {name} u Belgrade Arbor, Novi Beograd. Pogledajte raspored, sprat, karakteristike i pošaljite upit za ovaj stan.\"},\"retailDetail\":{\"title\":\"Poslovni prostor {name}\",\"description\":\"Poslovni prostor {name} u Belgrade Arbor, Novi Beograd. Pogledajte kvadraturu, sprat, raspored i pošaljite upit za ovu jedinicu.\"}},\"PrivacyPolicy\":{\"heading\":\"Politika privatnosti\",\"content\":\"$18\"}},\"now\":\"$undefined\",\"timeZone\":\"UTC\",\"children\":\"$L19\"}]\n"])</script><script>self.__next_f.push([1,"19:[\"$\",\"$L1a\",null,{}]\n1b:T5446,"])</script><script>self.__next_f.push([1,"## Privacy Policy and Notice on the Processing of Personal Data\n\nYour privacy and the security of your data are important to us. Therefore, the company HSK DEVELOPMENT DOO (hereinafter: the Company), fulfilling its duty as data controller towards you, as the individual from whom data relating to you is collected, provides you, at the moment of collecting such data and in accordance with the Law on Personal Data Protection (\"Official Gazette of the RS\", No. 87/2018, hereinafter: the Law), with the information set out below.\n\nThis Privacy Policy (hereinafter: the Policy) applies to natural persons, and personal data means any data by which you can be identified, directly or indirectly. All of your personal information is treated as strictly confidential and is adequately safeguarded by the Company and/or our trusted partners. Please read this Privacy Policy carefully. If you do not agree with our practices, please do not provide us with your personal data. By continuing to browse our website, you confirm that you agree to the Policy set out herein.\n\n## Information on the Controller and Recipient\n\nResponsibility for the processing of personal data in the capacity of controller lies with: HSK DEVELOPMENT DOO.\n\nThe recipient of personal data may be the company HSK DEVELOPMENT DOO.\n\nShould you have any questions or requests regarding the handling or protection of your personal data, you may contact us at the e-mail address [info@belgradearbor.rs](mailto:info@belgradearbor.rs) or in writing at the above-stated address of our registered office.\n\n## Scope of the Privacy Policy\n\nThis Policy covers the ways in which your personal data is processed when you interact with the Company, i.e. when you express interest in purchasing real estate or contact us in connection with the conclusion of a real estate purchase agreement within the residential and commercial complex, namely when you:\n\n– visit our website, or the websites used to advertise the Company's projects;\n\n– visit our profiles on social media platforms;\n\n– communicate with us by telephone, via the contact form on the website, by e-mail, or in any other manner;\n\n– use our systems and applications;\n\n– visit our sales offices;\n\n– attend our presentations or business events;\n\n– participate in our promotional or marketing activities (e.g. newsletter sign-up), surveys, and the like;\n\n– conclude with us an agreement relating to the purchase of real estate or any other agreement.\n\nOnly the provision of personal data collected for the fulfilment of specific legal obligations is mandatory. The provision of personal data on all other legal grounds is voluntary; however, please note that if you withhold certain data from us, we may in certain situations be unable to provide you with some of our services.\n\n## Personal Data We Collect\n\n### 1. Personal Data of Visitors to Our Website\n\nWhen you visit our website, or the websites used to advertise the Company's projects, the browser you use on your device will automatically, and without any action on your part, send to the server of our website: the IP address of the device from which the request was sent and which has internet access, the date and time of access, the name and URL of the retrieved file, the website/application from which access was made (referrer URL), the browser you use and, where applicable, the operating system of your internet-enabled computer, as well as the name of your internet service provider. The server temporarily stores the above data in a so-called log file for the following purposes:\n\n– ensuring the establishment of an uninterrupted connection;\n\n– ensuring the comfortable use of our website/application, or the websites used to advertise the Company's projects;\n\n– assessing system security and stability.\n\nThe data is stored temporarily, for the duration of your visit to the website, and is then automatically deleted. The legal basis for processing the IP address is Article 12, paragraph 1, item 6) of the Law on Personal Data Protection (legitimate interest), which arises from the above-stated purpose of data processing.\n\n### 2. Marketing and Other Activities\n\nFor the purposes of sending commercial messages and carrying out marketing activities, personal data is collected exclusively on the basis of the individual's consent (for example, in the case of newsletter sign-up, direct marketing, etc.), so that the data you have provided to us via the contact form, by telephone, or by e-mail is used in accordance with the purpose defined herein. If you have consented to receiving the newsletter via e-mail, SMS, and/or Viber, and/or to receiving other marketing material containing notifications about current offers and promotions relating to the services in our portfolio, we use your e-mail address, telephone number, and first and last name to send information about available real estate, promotions, news, and real estate purchase offers. We store and process this data for the purpose of sending commercial messages, newsletters, and/or other marketing material, including campaigns (offers, promotions, etc.).\n\nThe legal basis for processing data when sending commercial messages, newsletters, and/or other marketing material is your consent in accordance with Article 12, paragraph 1, item 1) of the Law on Personal Data Protection. You may withdraw your consent to receiving the newsletter/marketing material at any time. Withdrawal of consent does not affect the lawfulness of processing carried out on the basis of consent prior to its withdrawal. You may do so, for example, by unsubscribing from the newsletter mailing list on our website or on the website used to advertise the Company's projects. An unsubscribe link can be found at the end of each newsletter, while you may opt out of Viber or SMS notifications directly via the Viber application or by SMS, if you have consented to this form of communication. If you withdraw your consent, we will delete your data. Please be advised that, in connection with sending newsletters/Viber/SMS messages, we may engage external partners to perform these services, in which case your data (e-mail address and telephone number) may be transferred to such parties.\n\n### 3. Personal Data of Real Estate Buyers\n\nThe Company processes the personal data of individuals required for the preparation and conclusion of agreements and the performance of contractual obligations, i.e. the exercise of rights and obligations arising from concluded real estate purchase agreements within the residential and commercial complex. The personal data we collect from you includes: first and last name, address (street, house number, postal code, city, country), Unique Master Citizen Number (JMBG), ID card/passport number, copies of personal documents, and contact details (telephone number, e-mail address). We obtain all of your personal data directly from you.\n\nIn addition to the Real Estate Purchase Agreement, the Company may also conclude with you agreements entered into in the phase preceding the purchase process, such as real estate reservation agreements, deposit agreements for the purchase of real estate, and the like, in which case we collect the following data from you: first and last name, address (street, house number, postal code, city, country), and contact details (telephone number, e-mail address). We process your data for the purpose of preparing the Real Estate Purchase Agreement, as well as preparing and concluding the other agreements referred to in this section. The legal basis for processing this data is Article 12, paragraph 1, items 2) and 3) of the Law, having regard to the performance of contractual obligations and legal obligations, respectively.\n\n### 4. Other Personal Data You Have Provided to Us\n\nWe process the personal data that you have voluntarily provided to us upon initial contact, in the course of subsequent communication (e.g. by telephone call, e-mail, questionnaires, etc.), when visiting the Company's website or the websites used to advertise the Company's projects or our social media profiles, as well as personal data arising from our communication or business cooperation, which includes your identification data (first and last name) and your communication data (contact telephone number and e-mail address). We process your data in accordance with the defined purpose, in order to respond to your enquiry based on your expressed interest, present our offer to you in more detail, and provide other requested information.\n\nThe legal basis for this data processing is Article 12, paragraph 1, item 6) of the Law on Personal Data Protection (legitimate interest). Our — and at the same time your — (legitimate) interest in such data processing arises from the need to answer your questions, resolve any existing issues where necessary, and thereby ensure your satisfaction as a user of our services and of our website.\n\nIf you participate in any of our surveys/questionnaires, such participation is voluntary. In the case of anonymous surveys, we do not store any data that would allow us to identify the survey participant. We store only the date and time of your participation. Any personal data you have provided to us through a survey is considered voluntarily given and is stored in accordance with the provisions of the Law. If you have given your consent to the conduct of a survey, the legal basis for data processing is your consent in accordance with Article 12, paragraph 1, item 1) of the Law on Personal Data Protection. In that case, you have the right to withdraw your consent at any time. Withdrawal of consent does not affect the lawfulness of processing carried out on the basis of consent prior to its withdrawal.\n\nBy providing personal information, the visitor to the Company's website, or to the website used to advertise the Company's projects, understands and agrees that the security, integrity, and privacy of their data cannot be 100% guaranteed, notwithstanding the fact that the Company continuously undertakes all optimal measures to protect such data.\n\n### 5. Personal Data of Social Media Users\n\nOn the Company's social media pages, the Company processes data for the purpose of informing individuals about the residential and commercial complex, the real estate we offer for sale, the services we provide, promotions, important information, and company news — all with the aim of interacting with visitors to our social media pages, responding to questions, compliments, and criticism, and communicating with individuals interested in our services. Data processing is carried out in the interest of establishing communication, i.e. with the aim of interacting with and improving relations with our followers. The legal basis for processing your data is Article 12, paragraph 1, item 6) of the Law (legitimate interest).\n\nWe have only limited influence over the processing of data by social media platform operators (e.g. member administration and information sharing). Where we are able to influence and configure the parameters for the processing of your data so that the social media platform operator acts in compliance with data protection requirements, we take all measures available to us. However, in many respects we are unable to influence the operator's data processing, nor do we know exactly which data the operator processes. The platform operator manages the entire IT infrastructure of the service, adheres to its own data protection rules, and maintains a separate user relationship with you (if you are a registered user of the social media service). Furthermore, the operator is solely responsible for all matters relating to the data in your user profile, to which we, as a company, have no access. More detailed information on data processing by social media platform operators, and on the available means of objection, can be found in their data protection policies.\n\nContent you post on our social media pages, such as comments, videos, images, likes, public announcements, and the like, is published by the platform operator, and we never process it for any purpose other than the intended one. We reserve the right to delete unlawful or inappropriate content where necessary. We also process your data for the purpose of communicating with you. We may share your content on our page where this constitutes a function of the social media platform.\n\n## Access to Your Data\n\nWe treat your personal data as a business secret and protect it as such in accordance with applicable legal regulations and best practice. Within our company, access to the data you have made available to us is granted only to those organisational units and employees who require it in order to fulfil the purpose for which the personal data was collected. Your personal data will be processed by us, while third parties have the right to access and process your personal data only in the situations described below:\n\n– our trusted partners, i.e. legal entities with whom we cooperate and who assist us in our regular business operations. These may be entities that develop and maintain IT solutions, platforms, and servers, as well as entities that provide services to you on behalf of the Company, e.g. for marketing purposes. In such cases, these legal entities process your personal data exclusively on our behalf. In accordance with the agreements concluded, these service providers are obliged to use the data entrusted to them solely in accordance with our instructions and strictly for the purpose we have specified, with the obligation to adequately protect your data and keep it confidential;\n\n– parties with whom we cooperate in business, where we deem it necessary for the protection of our specific and justified interests, e.g. tax advisers, accountants, insurance companies, lawyers, and other advisers. In such cases, these parties process your personal data exclusively on our behalf;\n\n– competent authorities in the exercise of supervision over the lawfulness of business operations and conduct, as well as other legal entities where this is necessary for the performance of one of our legal obligations, e.g. an auditor. In such cases, these legal entities process your personal data for the purpose assigned to them by law;\n\n– other parties in connection with business transactions such as the sale of the company or part of the company, reorganisation, merger, joint venture, or any other form of disposal of our company or its assets.\n\nThere may also be a need to forward part of your enquiries to our contractual partners (e.g. suppliers, architects, or contractors, in the case of enquiries concerning specific products/materials and the like) for the purpose of processing your enquiry. However, in such cases the enquiry is anonymised beforehand, so that the third party cannot link it to you in any way. If, in an individual case, the forwarding of your personal data becomes necessary, we will inform you thereof in advance and request your consent. Third parties are restricted from using your personal data for any purposes other than those stated, and are obliged to protect and process your personal data in accordance with legal, regulatory, and contractual obligations. All legal entities with whom we cooperate have been selected with great care and, where required by law, are contractually bound to keep personal data confidential, in accordance with Article 45 of the Law on Personal Data Protection.\n\n## Transfer of Your Personal Data to Other Countries\n\nIn certain cases, we may share your personal data, i.e. transfer it to other countries, in accordance with the Law. When we do so, we transfer your data to servers located in the EU or in a country that ensures an adequate level of protection in accordance with the legislation of the Republic of Serbia. Access will be permitted only to a limited number of persons, i.e. authorised individuals, exclusively for the purpose of maintaining server functionality.\n\n## How We Protect Your Personal Data\n\nSome of the protective measures we implement include the following:\n\n– application of state-of-the-art methods for the protection of, and control of access to, data sources containing personal data;\n\n– restriction of access to sensitive data and restriction of user accounts that may access certain data, through the introduction of a system of roles and authorisations ensuring that only designated employees who require access to data for the performance of their work duties may view and process the relevant data;\n\n– continuous monitoring of all resources (physical premises where your data is stored) used for the processing of personal data.\n\nThe purpose of implementing these measures is to prevent the risk of destruction, loss, alteration, unauthorised disclosure of, or access to your personal data. We also require the application of appropriate protective measures with respect to your personal data from third parties that have the right to access and process your personal data. All personal data is stored on our server in the Republic of Serbia. Please note that the above protective measures do not apply to information or data that you choose to share publicly via social media or messaging applications.\n\n## Retention Period of Your Personal Data\n\nPersonal data is retained for as long as necessary to fulfil the purpose for which it was collected. If you have concluded an agreement with us, we retain your data for the duration of the rights and obligations arising from the agreement, and thereafter for as long as required by applicable regulations. We also retain your personal data after the termination of the contractual relationship if it is needed for the establishment, exercise, or defence of legal claims, or for compliance with applicable laws. To the extent possible, we will restrict the processing of your personal data to those limited purposes following the termination of the contractual relationship. Once the purpose has been fulfilled, i.e. upon expiry of the statutory retention period, the personal data will be permanently deleted.\n\n## Your Rights\n\nIf you decide to exercise one or more of your rights listed below, we are entitled to verify your identity, all for the purpose of protecting personal data. You may exercise your rights free of charge. Exceptionally, if your request is manifestly unfounded or excessive (e.g. you request personal data already in your possession), and in particular if the same request is repeated frequently, we are entitled to charge the necessary costs of acting upon your request or to refuse to act upon it. Please send all questions and requests relating to your rights in writing to the address stated in the section \"Information on the Controller\". We will respond to your request without delay, and at the latest within one month, unless the exceptional complexity of an individual case requires an extension of this period. In order to protect you as the data subject, you must identify yourself appropriately as the applicant, which will serve as an assurance to the Company that personal data is being disclosed to its rightful owner.\n\n**Access to Your Personal Data**\n\nYou have the right to request information from us as to whether we process your personal data, access to such data, as well as information about the processing in accordance with Article 26 of the Law.\n\n**Rectification of Inaccurate Data, Supplementation, Erasure, and Restriction of Use of Personal Data**\n\nYou have the right to request the rectification of your inaccurate personal data, as well as the right to supplement, erase, and restrict the use of your personal data.\n\n**Data Portability**\n\nYou have the right to obtain and request the transfer of your personal data.\n\n**Right to Withdraw Consent and Right to Be Forgotten**\n\nYou have the right to withdraw your consent to the processing of personal data, as well as to request the permanent erasure of your personal data processed on the basis of your consent.\n\n**Objection to the Processing or Handling of Your Personal Data**\n\nYou have the right to object to the processing of your personal data, as well as to our handling of your personal data in general. Please send your request by e-mail to the address stated in the section \"Information on the Controller\", indicating \"Objection to Processing\" in the subject line and explaining the reason for your objection and your request in the body of the message.\n\n**Right to Lodge a Complaint with the Commissioner for Information of Public Importance and Personal Data Protection**\n\nYou have the right, at any time, to lodge a complaint with the competent personal data protection authority — the Commissioner for Information of Public Importance and Personal Data Protection ([https://www.poverenik.rs/](https://www.poverenik.rs/)).\n\n## Amendments to the Privacy Policy\n\nThe Company reserves the right to amend this Privacy Policy at any time. Each amendment becomes effective upon its publication on the Company's website or in another appropriate manner. In this regard, we recommend that you regularly review the section relating to the Privacy Policy in order to stay informed of the latest updates.\n\nBelgrade, 2 November 2025\n\n*Note: Upon completion of the project's construction, minor deviations in the appearance of the facade or details may occur in relation to the renders presented. The numbering of the premises has been carried out in accordance with the real estate registration method of the Cadastre of the Republic of Serbia.*"])</script><script>self.__next_f.push([1,"15:[\"$\",\"$L17\",null,{\"formats\":\"$undefined\",\"locale\":\"en\",\"messages\":{\"Contact\":{\"title\":\"Submit\",\"request\":\"a request\",\"description\":\"For more information regarding available properties at Belgrade Arbor, please fill out the form \":\"Floor\",\"floorNumber\":\"{floor, selectordinal, one {#st} two {#nd} few {#rd} other {#th}} floor\",\"size\":\"Size\",\"type\":\"Type\",\"wing\":\"Wing\",\"businessSpace\":\"Business space\",\"submitRequest\":\"Submit a request\",\"description\":\"Thoughtfully designed commercial spaces with maximum visibility and excellent connectivity. Flexible layouts adapt to your business needs, whether you are growing a company or opening a new location.\",\"share\":\"Share\",\"copied\":\"Copied!\",\"resetFilters\":\"Reset Filters\",\"results\":\"Results\"}},\"AboutInvestor\":{\"Hero\":{\"heading\":\"ABOUT THE INVESTOR\",\"tag\":\"Perose Property Group\",\"paragraph\":\"Perose Property Group is a holding company specializing in the development, investment, and management of residential and commercial real estate projects across Serbia. Our portfolio includes developments such as AD Residence Zemun, Old City Residence and Harmony Homes in Kragujevac.\",\"cta\":\"Contact us\"},\"Static1\":{\"heading\":\"Each of our projects is defined by contemporary architecture, high construction standards, and carefully selected locations that provide long-term value for both owners and occupants.\",\"paragraph\":\"Our mission is to create lasting value through innovative and sustainable developments that enhance urban environments and improve quality of life.\"},\"Projects\":{\"projects\":[{\"name\":\"Belgrade Arbor\",\"location\":\"BELGRADE\",\"image\":\"/about-the-investor/slide1.webp\",\"descriptions\":[\"Belgrade Arbor is one of our flagship projects and reflects our philosophy that every square meter should contribute to functionality, quality, and long-term value. Through a consistent approach to design, the careful selection of partners, and a strong commitment to detail, we are creating a modern mixed-use complex that meets the demands of contemporary living and working while contributing to the evolving urban identity of Belgrade.\"]},{\"name\":\"AD Residence\",\"location\":\"B
